# ============================================================================
# Halo Sensor History – AppDaemon app configuration
# ============================================================================
# Add this block to your AppDaemon apps.yaml, or place this file in your
# apps/ directory if you use per-file app loading.
#
# OPTIONAL: set device_filter to your ESPHome device name to ignore events
# from other devices (useful if you have multiple Halo units).
#
# The entity ids the app writes are hard-coded in the SENSORS table in
# halo_sensor_history.py (sensor.halo_v1_79e35c_*). For a different unit,
# edit that table as well as device_filter.
# ============================================================================
halo_sensor_history:
  module: halo_sensor_history
  class: HaloSensorHistory
  # Your Home Assistant base URL (no trailing slash).
  ha_url: "http://homeassistant.local:8123"
  # Long-Lived Access Token – create one at HA Profile -> Security -> Long-Lived Access Tokens
  ha_token: "YOUR_LONG_LIVED_TOKEN_HERE"
  # Path to the HA recorder SQLite database (for per-minute history writes).
  # The app auto-detects common locations (/homeassistant, /config).
  # Override here ONLY if auto-detection fails (check logs on startup).
  # HAOS add-on path:  /homeassistant/home-assistant_v2.db  (default)
  # Docker /config:    /config/home-assistant_v2.db
  # ha_db_path: "/homeassistant/home-assistant_v2.db"
  # Restrict to a single device name (value of ${name} in ESPHome config).
  # Remove or set to null to accept batches from any device.
  device_filter: "halo-v1-79e35c"
