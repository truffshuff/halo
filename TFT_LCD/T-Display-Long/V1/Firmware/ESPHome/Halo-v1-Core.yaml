# ============================================================================
# HALO v1 - Core ESPHome Configuration
# ============================================================================
# ESP32-S3 Air Quality Monitor with LVGL Display
#
# Purpose: cross-capability glue, loaded LAST in the package list:
#   - the lvgl: block (draw buffer, gradients, bottom layer)
#   - page navigation (1 s rotation decision + 100 ms page-show dispatch)
#   - the api: block and its on_client_connected/disconnected triggers
#   - the 1 s WiFi-stats interval that drives the WiFi page
#   - the LED Effect select and the boot-time default page
#
# Hardware: LilyGo T-Display-Long (ESP32-S3, 180x640 AMOLED display)
# Dependencies: every package in the entry file (Halo-v1.yaml or
#   halo-v1-<mac>.yaml) except diagnostics.yaml and the BLE choice. The
#   rotation list and the page-show chain below name every page and its
#   page_rotation_* globals, and the api:/LED/WiFi blocks reach into airq,
#   airq_history, weather_led_effects, wifi_status and wireguard - so no
#   feature package can be commented out yet. See docs/ARCHITECTURE.md
#   "Known gaps" #2.
#
# Version: 26.09.29.2010
# Last Updated: September 29, 2026
# Baseline: ESPHome 2026.9.0
# ============================================================================

substitutions:
  name: halo
  version: "26.09.29.2010"
  device_description: ${name} - v${version}.
  
# ============================================================================
# MODULAR ARCHITECTURE (complete)
# ============================================================================
# Most components have been extracted to capability modules in packages/.
# This Core file contains cross-capability components and LVGL display config.
# See docs/ARCHITECTURE.md for the module map and load-order rules.
# ============================================================================

# Note: All switches moved to capability modules (see packages/features/)

select:
  - platform: template
    name: LED Effect
    id: led_effect_select
    entity_category: "Config"
    options:
      - "None"
      - "Rainbow Effect With Custom Values"
      - "Addressable Rainbow"
      - "Color Wipe"
      - "Scan"
      - "Twinkle"
      - "Fireworks"
      - "Strobe"
      - "Random Twinkle"
      - "Pink Lightning"
      - "AQI Color"
      - "Weather Condition"
      - "Auto Context"
      # "AQI Color" reads computed_halo_aqi (features/airq/airq_base.yaml).
      # "Weather Condition" and "Auto Context" are addressable_lambda effects
      # defined on rgb_light in features/weather/weather_led_effects.yaml.
      # Both packages must be loaded: this select references their ids.
    initial_option: "None"
    restore_value: true
    optimistic: true
    on_value:
      - lambda: |-
          // Don't apply effects during boot - let startup_light_blink handle it
          if (!id(boot_complete)) return;

          auto effect = id(led_effect_select).current_option();
          if (effect == "None") {
            auto call = id(rgb_light).turn_off();
            call.perform();
          } else if (effect == "AQI Color") {
            float aqi = id(computed_halo_aqi).state;
            if (std::isnan(aqi) || aqi <= 50) {
              auto call = id(rgb_light).turn_off();
              call.perform();
            } else {
              Color color;
              if (aqi <= 100) color = Color(255, 255, 0); // yellow
              else if (aqi <= 150) color = Color(255, 165, 0); // orange
              else if (aqi <= 200) color = Color(255, 0, 0); // red
              else if (aqi <= 300) color = Color(128, 0, 128); // purple
              else color = Color(128, 0, 0); // maroon
              auto call = id(rgb_light).turn_on();
              call.set_rgb(color.red / 255.0f, color.green / 255.0f, color.blue / 255.0f);
              call.perform();
            }
          } else if (effect == "Weather Condition" || effect == "Auto Context") {
            // Lambda-based effects - activate them
            auto call = id(rgb_light).turn_on();
            call.set_effect(std::string(effect));
            call.perform();
          } else {
            // Standard effects
            auto call = id(rgb_light).turn_on();
            call.set_effect(std::string(effect));
            call.perform();
          }

interval:

  # REMOVED 2026.09: the 2s "batched sensor UI update" interval.
  # weather_base.yaml did set `sensor_ui_dirty`, but this interval never acted
  # on it - the body only logged at DEBUG and cleared the flag again. No widget
  # was ever refreshed by it, so it was pure overhead. The flag, its five write
  # sites and the last_sensor_ui_update global were removed with it.
  # Sensor-driven LVGL updates come from each sensor's own on_value trigger and
  # its *_needs_render flag. See docs/ARCHITECTURE.md "Known gaps".

  # Display watchdog and periodic health check intervals moved to features/diagnostics/diagnostics.yaml

  # Automatic page rotation - controllable via Home Assistant with custom page selection and order
  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
                if (!id(boot_complete)) return false;
                if (id(ota_in_progress)) return false;
                // Only rotate if auto rotation is enabled
                if (!id(auto_page_rotation_enabled)) return false;

                const uint32_t now = millis();
                const uint32_t interval_ms = id(auto_page_rotation_interval) * 1000;

                // Check if enough time has passed since last rotation
                if ((now - id(last_auto_rotation_time)) < interval_ms) return false;

                // Build the rotation order on the stack.
                //
                // MEMORY NOTE (2026.09): this used to build a std::vector<int>
                // plus a std::vector<std::string> on every single tick of a 1s
                // interval - roughly 16 heap allocate/free pairs per second,
                // for the entire uptime of the device. That is pure heap churn
                // and a fragmentation source. Fixed-size stack arrays of
                // string literals do the same job with zero allocations.
                // MAX_PAGES must be >= the number of push() calls below.
                constexpr size_t MAX_PAGES = 8;
                int page_orders[MAX_PAGES];
                const char *page_ids[MAX_PAGES];
                size_t page_count = 0;

                auto push = [&](bool enabled, int order, const char *id_str) {
                  if (enabled && page_count < MAX_PAGES) {
                    page_orders[page_count] = order;
                    page_ids[page_count] = id_str;
                    page_count++;
                  }
                };

                // Each global below is supplied by the matching feature package.
                // A disabled feature must still define its *_enabled global.
                push(id(page_rotation_vertical_clock_enabled), id(page_rotation_vertical_clock_order), "vertical_clock");
                push(id(page_rotation_AirQ_enabled),            id(page_rotation_AirQ_order),            "airq");
                push(id(page_rotation_wifi_enabled),            id(page_rotation_wifi_order),            "wifi");
                push(id(page_rotation_weather_enabled),         id(page_rotation_weather_order),         "weather");
                push(id(page_rotation_hourly_forecast_enabled), id(page_rotation_hourly_forecast_order), "hourly_forecast");
                push(id(page_rotation_hourly_summary_enabled),  id(page_rotation_hourly_summary_order),  "hourly_summary_1");
                push(id(page_rotation_daily_forecast_enabled),  id(page_rotation_daily_forecast_order),  "daily_forecast");
                push(id(page_rotation_printer_enabled),         id(page_rotation_printer_order),         "printer");

                // If no pages are enabled, don't rotate
                if (page_count == 0) {
                  ESP_LOGW("page_rotation", "No pages enabled for rotation");
                  return false;
                }

                // Insertion sort by order number (page_count <= 8, so this is
                // cheaper than anything fancier and needs no scratch memory).
                for (size_t i = 1; i < page_count; i++) {
                  const int order = page_orders[i];
                  const char *pid = page_ids[i];
                  size_t j = i;
                  while (j > 0 && page_orders[j - 1] > order) {
                    page_orders[j] = page_orders[j - 1];
                    page_ids[j] = page_ids[j - 1];
                    j--;
                  }
                  page_orders[j] = order;
                  page_ids[j] = pid;
                }

                // Position within the rotation sequence, preserved across ticks.
                static size_t rotation_position = 0;
                if (rotation_position >= page_count) {
                  rotation_position = 0;
                }

                // Log BEFORE advancing. The previous version advanced first and
                // then indexed back into the array, which printed the order
                // number of the wrong page.
                ESP_LOGD("page_rotation", "Rotating to page '%s' (order: %d)",
                         page_ids[rotation_position], page_orders[rotation_position]);

                id(current_page_name) = page_ids[rotation_position];
                rotation_position = (rotation_position + 1) % page_count;

                id(last_auto_rotation_time) = now;
                return true;
          then:
            # The condition above only picks the page and writes
            # current_page_name. The 100 ms interval below notices the change
            # and issues the lvgl.page.show.
            - logger.log:
                format: "Core: Rotation scheduled to page '%s'"
                args: ['id(current_page_name).c_str()']
                level: DEBUG

  # Note: Colon blink interval moved to features/clock/clock_base.yaml
  # Note: Weather refresh intervals moved to features/weather/weather_base.yaml

  # Page-show dispatch. lvgl.page.show needs a literal page id (it cannot take
  # a lambda), so this maps current_page_name to a page through a nested
  # if/else chain. Anything that sets current_page_name - rotation, the HA
  # "Go to ... Page" buttons, WireGuard's jump to AirQ - is shown from here.
  # "hourly_summary_2" is only set by the summary page's own nav button.
  - interval: 100ms
    then:
      - if:
          condition:
            lambda: |-
                static std::string last_displayed_page = "";

                // Don't do anything until boot is complete
                if (!id(boot_complete)) return false;

                // Check if page ID has changed
                std::string current = id(current_page_name);
                if (current == last_displayed_page) return false;

                // Page ID changed
                last_displayed_page = current;
                ESP_LOGD("page_rotation", "Page changed to '%s'", current.c_str());
                return true;
          then:
            # Vertical Clock
            - if:
                condition:
                  lambda: 'return id(current_page_name) == "vertical_clock";'
                then:
                  - logger.log: "Page rotation: Showing Vertical Clock"
                  - lvgl.page.show:
                      id: vertical_clock_page
                      animation: OUT_LEFT
                      time: 300ms
                else:
                  # AirQ
                  - if:
                      condition:
                        lambda: 'return id(current_page_name) == "airq";'
                      then:
                        - logger.log: "Page rotation: Showing AirQ page"
                        - lvgl.page.show:
                            id: AirQ_page
                            animation: OUT_LEFT
                            time: 300ms
                      else:
                        # WiFi
                        - if:
                            condition:
                              lambda: 'return id(current_page_name) == "wifi";'
                            then:
                              - logger.log: "Page rotation: Showing WiFi page"
                              - lvgl.page.show:
                                  id: wifi_page
                                  animation: OUT_LEFT
                                  time: 300ms
                            else:
                              # Weather
                              - if:
                                  condition:
                                    lambda: 'return id(current_page_name) == "weather";'
                                  then:
                                    - logger.log: "Page rotation: Showing Weather page"
                                    - lvgl.page.show:
                                        id: weather_forecast_page
                                        animation: OUT_LEFT
                                        time: 300ms
                                  else:
                                    # Hourly Summary Page 1
                                    - if:
                                        condition:
                                          lambda: 'return id(current_page_name) == "hourly_summary_1";'
                                        then:
                                          - logger.log: "Page rotation: Showing Hourly Summary Page 1"
                                          - lvgl.page.show:
                                              id: hourly_summary_page_1
                                              animation: OUT_LEFT
                                              time: 300ms
                                        else:
                                          # Hourly Summary Page 2
                                          - if:
                                              condition:
                                                lambda: 'return id(current_page_name) == "hourly_summary_2";'
                                              then:
                                                - logger.log: "Page rotation: Showing Hourly Summary Page 2"
                                                - lvgl.page.show:
                                                    id: hourly_summary_page_2
                                                    animation: OUT_LEFT
                                                    time: 300ms
                                              else:
                                                # Daily Forecast
                                                - if:
                                                    condition:
                                                      lambda: 'return id(current_page_name) == "daily_forecast";'
                                                    then:
                                                      - logger.log: "Page rotation: Showing Daily Forecast page"
                                                      - lvgl.page.show:
                                                          id: daily_forecast_page
                                                          animation: OUT_LEFT
                                                          time: 300ms
                                                    else:
                                                      # Hourly Forecast (8 pages)
                                                      - if:
                                                          condition:
                                                            lambda: 'return id(current_page_name) == "hourly_forecast";'
                                                          then:
                                                            - logger.log: "Page rotation: Showing Hourly Forecast Page 1"
                                                            - lvgl.page.show:
                                                                id: hourly_forecast_page
                                                                animation: OUT_LEFT
                                                                time: 300ms
                                                          else:
                                                            # Printer
                                                            - if:
                                                                condition:
                                                                  lambda: 'return id(current_page_name) == "printer";'
                                                                then:
                                                                  - logger.log: "Page rotation: Showing Printer page"
                                                                  - lvgl.page.show:
                                                                      id: printer_page
                                                                      animation: OUT_LEFT
                                                                      time: 300ms
                                                                else:
                                                                  # Unknown page - fall back to vertical clock
                                                                  - logger.log:
                                                                      format: "Page rotation: Page '%s' not available, falling back to Vertical Clock"
                                                                      args: ['id(current_page_name).c_str()']
                                                                      level: WARN
                                                                  - lvgl.page.show:
                                                                      id: vertical_clock_page
                                                                      animation: OUT_LEFT
                                                                      time: 300ms


  - interval: 1s  # Reduced from 5s for faster WiFi stats updates
    then:
      - if:
          condition:
            lambda: 'return id(boot_complete);'
          then:
            - if:
                condition:
                  wifi.connected:
                then:
                  - lambda: |-
                      char buffer[32];
                      snprintf(buffer, sizeof(buffer), "Signal: %.0f dBm", id(wifi_signal_db).state);
                      std::string new_text(buffer);
                      if (new_text != id(wifi_signal_last_text)) {
                      id(wifi_signal_last_text) = new_text;
                      id(wifi_signal_needs_render) = true;
                      }
                  - if:
                      condition:
                        # 2026.09: added the missing `needs_render` guard. Every
                        # sibling block in this interval had it; this one did
                        # not, so the RSSI label was re-rendered once a second
                        # while the WiFi page was visible even when unchanged.
                        lambda: 'return id(wifi_signal_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.label.update:
                            id: wifi_signal_label
                            text: !lambda 'return id(wifi_signal_last_text);'
                        - lambda: 'id(wifi_signal_needs_render) = false;'
                  # Update WiFi signal bar
                  - lambda: |-
                      float signal = id(wifi_signal_db).state;
                      if (std::isnan(signal)) {
                      signal = -200.0f;
                      }
                      if (signal != id(wifi_signal_bar_last_value)) {
                      id(wifi_signal_bar_last_value) = signal;
                      id(wifi_signal_bar_needs_render) = true;
                      }
                  - if:
                      condition:
                        # 2026.09: added the missing `needs_render` guard (see above).
                        lambda: 'return id(wifi_signal_bar_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.bar.update:
                            id: wifi_signal_bar
                            value: !lambda 'return id(wifi_signal_bar_last_value);'
                        - lambda: 'id(wifi_signal_bar_needs_render) = false;'
                  # Update WiFi SSID
                  - lambda: |-
                      char ssid_buf[33] = {};
                      esphome::wifi::global_wifi_component->wifi_ssid_to(ssid_buf);
                      std::string new_text = std::string("SSID: ") + ssid_buf;
                      if (new_text != id(wifi_ssid_last_text)) {
                      id(wifi_ssid_last_text) = new_text;
                      id(wifi_ssid_needs_render) = true;
                      }
                  - if:
                      condition:
                        lambda: 'return id(wifi_ssid_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.label.update:
                            id: wifi_ssid_label
                            text: !lambda 'return id(wifi_ssid_last_text);'
                        - lambda: 'id(wifi_ssid_needs_render) = false;'
                  # Update WiFi IP address
                  - lambda: |-
                      auto addresses = esphome::wifi::global_wifi_component->get_ip_addresses();
                      std::string ip_text = "IP: Not assigned";
                      if (!addresses.empty()) {
                      char ip_buf[40];
                      addresses[0].str_to(ip_buf);
                      ip_text = std::string("IP: ") + ip_buf;
                      }
                      if (ip_text != id(wifi_ip_last_text)) {
                      id(wifi_ip_last_text) = ip_text;
                      id(wifi_ip_needs_render) = true;
                      }
                  - if:
                      condition:
                        lambda: 'return id(wifi_ip_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.label.update:
                            id: wifi_ip_label
                            text: !lambda 'return id(wifi_ip_last_text);'
                        - lambda: 'id(wifi_ip_needs_render) = false;'
                  # Update Home Assistant connection status icon
                  - lambda: |-
                      bool ha_connected = id(ink_ha_connected).state;
                      if (ha_connected != id(ha_status_last_state)) {
                      id(ha_status_last_state) = ha_connected;
                      id(ha_status_needs_render) = true;
                      }
                  - if:
                      condition:
                        lambda: 'return id(ha_status_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.widget.update:
                            id: ha_status_icon
                            text_color: !lambda 'return id(ink_ha_connected).state ? id(my_green) : id(my_gray);'
                        - lambda: 'id(ha_status_needs_render) = false;'
                else:
                  # WiFi disconnected.
                  # (A commented-out block that hid the YM logo on the AirQ page
                  # was removed in 2026.09 along with the now-unused
                  # `wifi_logo_visible` global - it had been dead for months.)
                  # Update disconnected signal text
                  - lambda: |-
                      const std::string new_text = "Signal: --";
                      if (new_text != id(wifi_signal_last_text)) {
                      id(wifi_signal_last_text) = new_text;
                      id(wifi_signal_needs_render) = true;
                      }
                  - if:
                      condition:
                        lambda: 'return id(wifi_signal_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.label.update:
                            id: wifi_signal_label
                            text: !lambda 'return id(wifi_signal_last_text);'
                        - lambda: 'id(wifi_signal_needs_render) = false;'
                  # Update disconnected signal bar
                  - lambda: |-
                      float new_value = -200.0f;
                      if (new_value != id(wifi_signal_bar_last_value)) {
                      id(wifi_signal_bar_last_value) = new_value;
                      id(wifi_signal_bar_needs_render) = true;
                      }
                  - if:
                      condition:
                        lambda: 'return id(wifi_signal_bar_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.bar.update:
                            id: wifi_signal_bar
                            value: !lambda 'return id(wifi_signal_bar_last_value);'
                        - lambda: 'id(wifi_signal_bar_needs_render) = false;'
                  # Update disconnected SSID
                  - lambda: |-
                      const std::string ssid_text = "SSID: Not connected";
                      if (ssid_text != id(wifi_ssid_last_text)) {
                      id(wifi_ssid_last_text) = ssid_text;
                      id(wifi_ssid_needs_render) = true;
                      }
                  - if:
                      condition:
                        lambda: 'return id(wifi_ssid_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.label.update:
                            id: wifi_ssid_label
                            text: !lambda 'return id(wifi_ssid_last_text);'
                        - lambda: 'id(wifi_ssid_needs_render) = false;'
                  # Update disconnected IP
                  - lambda: |-
                      const std::string ip_text = "IP: Not connected";
                      if (ip_text != id(wifi_ip_last_text)) {
                      id(wifi_ip_last_text) = ip_text;
                      id(wifi_ip_needs_render) = true;
                      }
                  - if:
                      condition:
                        lambda: 'return id(wifi_ip_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.label.update:
                            id: wifi_ip_label
                            text: !lambda 'return id(wifi_ip_last_text);'
                        - lambda: 'id(wifi_ip_needs_render) = false;'
                  # WireGuard labels are normally rendered by the on_value/on_state
                  # triggers in features/wireguard/wireguard.yaml and by the WiFi
                  # page's on_load. These four blocks sit in the WiFi-DISCONNECTED
                  # branch only: they flush any pending WireGuard text while the
                  # WiFi page is showing and WiFi is down.
                  - if:
                      condition:
                        lambda: 'return id(wg_status_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.label.update:
                            id: wg_status_label
                            text: !lambda 'return id(wg_status_last_text);'
                        - lambda: 'id(wg_status_needs_render) = false;'
                  - if:
                      condition:
                        lambda: 'return id(wg_address_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.label.update:
                            id: wg_address_label
                            text: !lambda 'return id(wg_address_last_text);'
                        - lambda: 'id(wg_address_needs_render) = false;'
                  - if:
                      condition:
                        lambda: 'return id(wg_handshake_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.label.update:
                            id: wg_handshake_label
                            text: !lambda 'return id(wg_handshake_last_text);'
                        - lambda: 'id(wg_handshake_needs_render) = false;'
                  - if:
                      condition:
                        lambda: 'return id(wg_endpoint_needs_render) && id(current_page_name) == "wifi";'
                      then:
                        - lvgl.label.update:
                            id: wg_endpoint_label
                            text: !lambda 'return id(wg_endpoint_last_text);'
                        - lambda: 'id(wg_endpoint_needs_render) = false;'

  # DISABLED – this watchdog reboots the device after 30 min of API disconnect, which wipes
  # the offline sensor history ring buffer. api_reboot_timeout: "0s" is the correct approach.
  # Uncomment only if you do NOT care about preserving the offline history buffer.
  #
  # - interval: 5min
  #   then:
  #     - if:
  #         condition:
  #           lambda: |-
  #               static uint32_t last_connected = millis();
  #               if (id(ink_ha_connected).state) {
  #               last_connected = millis();
  #               return false;
  #               }
  #               return (millis() - last_connected) > 1800000; // 30 min
  #         then:
  #           - logger.log: "API disconnected for 30+ minutes, triggering automatic reboot..."
  #           - button.press: esp_reboot_button  # Trigger ESP restart

# ============================================================================
# Home Assistant API Configuration
# ============================================================================
# Handles communication with Home Assistant for sensors, switches, and services
#
# reboot_timeout: 0s - CRITICAL SETTING (value comes from the
# api_reboot_timeout substitution in the entry file)
#   Disables automatic device reboot when HA connection is lost
#   WHY: the AQI offline history ring buffer (features/airq/airq_history.yaml)
#        lives in RAM and a reboot wipes it - during exactly the outages it
#        exists to cover. networking.yaml sets wifi: reboot_timeout: 0s for
#        the same reason. See docs/ARCHITECTURE.md section 8.
#   RISK: If API breaks, device won't auto-recover without manual intervention
#
# The encryption key is declared in system/esphome_core.yaml; every other api:
# key lives here.
# ============================================================================
api:
  reboot_timeout: ${api_reboot_timeout}  # Set to 0s to disable auto-reboot on API disconnect

  # Connection limits. These bound worst-case INTERNAL DRAM use, because each
  # accepted connection carries its own lwIP socket buffers plus an API send
  # buffer. ESPHome's ESP32 defaults are listen_backlog 4 / max_connections 5 /
  # max_send_queue 8; the values below keep headroom above the defaults without
  # the previous, unjustified ceilings (8 / 16 / 64).
  listen_backlog: 4
  # Real demand is: Home Assistant (1) + `esphome logs` (1) + the occasional
  # dashboard or second HA instance. 8 is generous; 16 was never reachable.
  max_connections: 8
  # Per-connection TCP backlog, used only when the socket send buffer is full.
  # ESPHome charges 2 KB per slot, so 64 allowed a ~64 KB buffer and, since
  # 2026.9.0 (esphome#19093), that buffer is KEPT at its high-water mark
  # instead of being freed after each stall. 16 caps it at ~32 KB while still
  # being twice the platform default. Raise it only if the log shows dropped
  # connections during Bluetooth-proxy advertisement bursts.
  max_send_queue: 16
  on_client_connected:
      - delay: 1s  # Brief delay for API stabilization
      - lambda: 'id(cycleCounter) = 30;'  # Stop startup rainbow animation
      - lambda: 'id(boot_complete) = true;'  # Enable normal operation
      # Start the rotation interval now, so the default page (or whatever is
      # showing) gets a full interval before the first rotation.
      - lambda: 'id(last_auto_rotation_time) = millis();'

      # ========================================================================
      # Restore User LED Effect Selection
      # ========================================================================
      # WHY: During boot, startup_light_blink takes control of RGB light
      #      When HA connects, we restore user's saved effect preference
      # DELAY: 2s ensures rainbow effect fully stops before applying new effect
      # ========================================================================
      - delay: 2s
      - lambda: |-
          auto effect = id(led_effect_select).current_option();
          if (effect == "None") {
          auto call = id(rgb_light).turn_off();
          call.perform();
          } else if (effect == "AQI Color") {
          float aqi = id(computed_halo_aqi).state;
          if (std::isnan(aqi) || aqi <= 50) {
            auto call = id(rgb_light).turn_off();
            call.perform();
          } else {
            Color color;
            if (aqi <= 100) color = Color(255, 255, 0);
            else if (aqi <= 150) color = Color(255, 165, 0);
            else if (aqi <= 200) color = Color(255, 0, 0);
            else if (aqi <= 300) color = Color(128, 0, 128);
            else color = Color(128, 0, 0);
            auto call = id(rgb_light).turn_on();
            call.set_rgb(color.red / 255.0f, color.green / 255.0f, color.blue / 255.0f);
            call.perform();
          }
          } else if (effect == "Weather Condition" || effect == "Auto Context") {
          // New lambda effects - activate them
          auto call = id(rgb_light).turn_on();
          call.set_effect(std::string(effect));
          call.perform();
          } else {
          auto call = id(rgb_light).turn_on();
          call.set_effect(std::string(effect));
          call.perform();
          }
      # ========================================================================
      # AQI History Buffer Flush
      # ========================================================================
      # Replays any AQI values that were buffered during the HA outage.
      # Extra delay lets the API fully stabilise before sending a potentially
      # large batch event.  Script is a no-op when the buffer is empty.
      # NOTE: Requires packages/features/airq/airq_history.yaml to be included.
      #       If you remove that package, also remove these two lines below.
      # ========================================================================
      - delay: 5s
      - script.execute: flush_aqi_history

      # BLE scanning needs no start here: the BLE package's tracker scans
      # from boot (ble_scanner_switch pauses/resumes it).

  on_client_disconnected:
    # BLE scanning keeps running; the proxy tears its connections down itself.
    then:
      - logger.log: "Home Assistant disconnected"
      # Restart the offline rainbow (networking.yaml intervals), as at boot.
      # WiFi on_disconnect alone misses this: the API times out after WiFi is
      # back, and on_connect has already set the counter to 30. Any client
      # counts here, but the interval also needs ink_ha_connected off, so an
      # `esphome logs` disconnect while HA stays connected does nothing.
      - lambda: 'id(cycleCounter) = 0;'

  # NOTE: an empty `services:` key used to sit here. `services` is the legacy
  # name for `actions`, and ESPHome 2026.9.0 changed user-defined action
  # metadata (esphome#18881). An empty block bought nothing, so it was removed.
  # To expose a callable action to Home Assistant, add an `actions:` list here.
  # (features/airq/airq_base.yaml still declares its two CO2/SEN55 actions
  # under the legacy `services:` name.)

# Scripts, numbers, switches and sensors live in the capability modules
# under packages/.

lvgl:
  id: lvgl_main
  rotation: 0  # Moved here from display: (LVGL v9 breaking change in 2026.4.0)
  displays:
    - lily_display
  touchscreens:
    - lily_touch
  # ==========================================================================
  # LVGL draw buffer - the single largest tunable memory allocation
  # ==========================================================================
  # ESPHome quantises this percentage to a fraction of the screen: >=75% -> 1/1,
  # >=37.5% -> 1/2, >19% -> 1/4, otherwise 1/8. It then picks the heap:
  # a buffer of 1/4 or 1/8 of the screen is tried in INTERNAL DRAM first
  # ("small buffer, better performance"), while 1/1 and 1/2 go straight to
  # PSRAM. (esphome/components/lvgl/lvgl_esphome.cpp, LvglComponent::setup)
  #
  # The old value of 30% therefore quantised to 1/4 and put ~57.6 KB in
  # INTERNAL DRAM - not in PSRAM as the old comment claimed. 50% quantises to
  # 1/2, so the buffer (180*640/2*2 = 115.2 KB) is allocated from PSRAM and
  # that internal DRAM is returned to the heap.
  #
  # TRADE-OFF: rendering now reads/writes PSRAM instead of DRAM. This board
  # runs octal PSRAM at 80 MHz with execute_from_psram enabled, and ESPHome
  # 2026.9.0 added PSRAM DMA for external SPI buffers (esphome#18699), so the
  # flush path stays on DMA. The display's 5 MHz QSPI data_rate dominates
  # frame time regardless.
  #
  # REVERT: if the display tears, stutters, or fails to allocate, set this back
  # to 30% and expect ~57.6 KB less free internal heap.
  # REQUIRES DEVICE TESTING - see docs/MEMORY.md.
  buffer_size: 50%
  byte_order: big_endian
  color_depth: 16
  
  bottom_layer:
    bg_color: 0x000000
    bg_opa: COVER
  log_level: WARN  # Reduce logging overhead

  # Gradient definitions used by WiFi pages
  gradients:
    - id: wifi_signal_gradient
      direction: hor
      stops:
        - color: 0xFF0000  # Red - weak signal
          position: 0
        - color: 0xFF8000  # Orange
          position: 64
        - color: 0xFFFF00  # Yellow
          position: 128
        - color: 0x80FF00  # Yellow-green
          position: 192
        - color: 0x00FF00  # Green - strong signal
          position: 255

  # PAGES: every page is declared by its feature package under
  # packages/features/<feature>/ and merged into this lvgl: block. There is
  # deliberately no pages: key here. Pages appear - and lvgl.page.next cycles
  # through them - in package load order.

# ============================================================================
# Buttons
# ============================================================================
# ESP Reboot, Factory Reset ESP, Clear Improv WiFi Credentials and Recover
# Display (Hard Reset) live in features/diagnostics/diagnostics.yaml, so a
# build without diagnostics has none of them.
# ============================================================================

# ============================================================================
# WiFi
# ============================================================================
# system/networking.yaml owns the wifi: component. Credentials come from the
# entry file's wifi_ssid / wifi_password substitutions, which read
# secrets.yaml (see secrets.yaml.example).
# ============================================================================

mdns:
  disabled: false

# REMOVED 2026.09: a second `wifi:` block lived here with the same ssid /
# password / on_connect / on_disconnect as packages/system/networking.yaml.
# ESPHome merges trigger lists across packages, so BOTH copies of the
# cycleCounter lambda fired on every connect and disconnect. networking.yaml is
# now the single owner of the wifi: component (it also holds the WireGuard
# re-handshake logic that must run on reconnect).

# ============================================================================
# WireGuard VPN
# ============================================================================
# Configured in features/wireguard/wireguard.yaml. Its header lists the
# secrets it needs; secrets.yaml.example has placeholders for all of them.
# ============================================================================

# ============================================================================
# Boot sequence
# ============================================================================
# on_boot priority is ESPHome's setup priority: a hook runs once every
# component at or above that priority has finished setup(). For reference,
# ESPHome's setup_priority constants are HARDWARE 800, DATA 600, PROCESSOR
# 400, BLUETOOTH 350, WIFI 250, AFTER_WIFI 200, AFTER_CONNECTION 100,
# LATE -100.
#
# Hooks in this configuration:
#   priority 50   features/wireguard/wireguard.yaml - wait 20 s, then enable
#                 WireGuard once SNTP is valid (2 min timeout)
#   priority -100 below - resolve the default page and show the clock
# ============================================================================

# ============================================================================
# BLUETOOTH PROXY / IMPROV
# ============================================================================
# Configured by the BLE package selected in the device file, not here:
#   features/ble/ble_improv.yaml   NimBLE: bluetooth_proxy + nimble_tracker + nimble_improv
#   features/ble/ble_esphome.yaml  Bluedroid: bluetooth_proxy + esp32_ble_tracker + esp32_improv
#   features/ble/ble_stub.yaml     no BLE
# Both stacks start scanning on boot on their own and keep scanning whether
# or not Home Assistant is connected; ble_scanner_switch pauses it (OTA,
# weather fetches).
# ============================================================================

esphome:
  name: ${name}

  # The weather_helpers:: functions used by the weather lambdas come from the
  # header-only weather_helpers external component, declared in
  # system/esphome_core.yaml and instantiated in system/system_management.yaml.

  # NOTE: an empty `libraries:` key was removed in 2026.09. It is a
  # PlatformIO-toolchain concept and this build uses the native ESP-IDF
  # toolchain, so it resolved to an empty list and did nothing.

  on_boot:
    # -------------------------------------------------------------------------
    # Default page (priority -100, after every component's setup)
    # -------------------------------------------------------------------------
    # Shows the clock, then sets current_page_name from the "Default Page at
    # Boot" select (features/page_rotation/page_rotation.yaml). The 100 ms
    # page-show interval switches to that page once boot_complete is set
    # (first HA connection), and api: on_client_connected restarts the
    # rotation timer so the page stays up for one full rotation interval.
    # The startup RGB animation is driven by the intervals in
    # system/networking.yaml, not from here.
    - priority: -100
      then:
        - logger.log: "Boot sequence starting (priority -100)"
        - delay: 2s  # Extra delay to avoid early LVGL page-switch race at boot

        # The clock is the page shown until Home Assistant connects. Show it
        # first: its on_load writes current_page_name, which the lambda below
        # then overrides with the default page.
        - logger.log: "Boot: Showing Vertical Clock page"
        - lvgl.page.show: vertical_clock_page

        # Map the select's option to a page name the 100 ms interval knows.
        - lambda: |-
            static const struct { const char *option; const char *page; } DEFAULT_PAGES[] = {
              {"Vertical Clock", "vertical_clock"},
              {"Weather", "weather"},
              {"AirQ", "airq"},
              {"WiFi", "wifi"},
              {"Daily Forecast", "daily_forecast"},
              {"Hourly Forecast", "hourly_forecast"},
              {"Hourly Summary", "hourly_summary_1"},
              {"3D Printer", "printer"},
            };
            const char *page = "vertical_clock";
            const auto choice = id(default_page_select_boot).current_option();
            for (const auto &entry : DEFAULT_PAGES) {
              if (choice == entry.option) {
                page = entry.page;
                break;
              }
            }
            id(current_page_name) = page;
            ESP_LOGI("boot", "Default page: %s (shown once Home Assistant connects)", page);
        - logger.log: "Boot sequence complete"
