# ============================================================================
# Global Variables - Shared System State
# ============================================================================
# System-level global variables shared across multiple modules
# Dependencies: None (loaded first)
#
# This file contains ONLY globals that are truly shared across multiple modules
# or are fundamental to system operation. Feature-specific globals have been
# moved to their respective feature files.
#
# CONTENTS:
#   - Startup/boot state (boot_complete flag, cycleCounter for LED animation)
#   - OTA operation state (ota_in_progress)
#   - Display backlight state (display_backlight_is_on)
#   - Display flush health (last_display_update_time, display_recovery_attempts)
#   - Default page configuration (default_page_index)
#
# REMOVED 2026.09 (dead state, no remaining consumer anywhere in the tree):
#   - display_flush_count, last_display_flush_count - never read
#   - sensor_ui_dirty, last_sensor_ui_update - weather_base.yaml set the dirty
#     flag, but the 2s batching interval in Halo-v1-Core.yaml that consumed it
#     only logged and cleared it; it never refreshed any widget. See
#     docs/ARCHITECTURE.md "Known gaps" for what this means for the weather
#     page's live temperature labels.
#
# GLOBALS MOVED TO FEATURE FILES (complete):
#   - Clock → features/clock/clock_base.yaml
#   - Page Rotation → features/page_rotation/page_rotation.yaml
#   - Weather → features/weather/weather_base.yaml
#   - WireGuard → features/wireguard/wireguard.yaml
#   - AirQ → features/airq/airq_base.yaml
#   - WiFi Status → features/wifi_status/wifi_page_base.yaml
#   - Diagnostics → features/diagnostics/diagnostics.yaml
# ============================================================================

globals:

  # ============================================================================
  # Startup/Boot State
  # ============================================================================

  # Boot completion flag
  # Set to true after the first Home Assistant API client connects.
  # Guards page rotation, watchdog, WireGuard cycling and LED effect selection
  # so they don't fire during the startup sequence.
  # Required by: networking.yaml, Halo-v1-Core.yaml, page_rotation.yaml, diagnostics.yaml
  - id: boot_complete
    type: bool
    restore_value: no
    initial_value: 'false'

  # Startup light blink cycle counter
  # Tracks how many 1-second intervals have passed during startup LED animation
  # Used to stop rainbow effect after 30 seconds and turn off light
  # NOTE: Shared between networking.yaml (WiFi events) and ble_improv.yaml (LED effects)
  # Cannot be moved to BLE module due to load order dependency with networking module
  - id: cycleCounter
    type: int
    restore_value: no
    initial_value: '0'

  # ============================================================================
  # Page Configuration
  # ============================================================================

  # Default page to show on startup
  - id: default_page_index
    type: int
    restore_value: yes
    initial_value: '0'

  # ============================================================================
  # OTA Operations
  # ============================================================================

  # Flag to indicate OTA firmware update in progress
  # Prevents page rotation and other operations during critical updates
  - id: ota_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'

  # ============================================================================
  # Display State Management
  # ============================================================================

  # Display backlight state tracking
  # Used to prevent redundant backlight on/off commands
  - id: display_backlight_is_on
    type: bool
    restore_value: no
    initial_value: 'true'

  # Updated only after the display driver completes a flush.
  - id: last_display_update_time
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Consecutive hardware recovery attempts since the last successful flush.
  - id: display_recovery_attempts
    type: uint8_t
    restore_value: no
    initial_value: '0'

# ============================================================================
# BLE Scanner Control
# ============================================================================
# System-wide switch to control BLE scanning. Pausing BLE scanning reduces
# API traffic and prevents buffer overflow during operations that require
# clean API communication.
#
# Automatically paused during:
#   - Weather forecast fetches (daily and hourly)
#   - OTA firmware updates
#
# Can also be manually controlled from Home Assistant or used in custom automations.
#
# Usage:
#   Pause: - switch.turn_off: ble_scanner_switch
#   Resume: - switch.turn_on: ble_scanner_switch
#
# NOTE: The actual switch definition is in ble_improv.yaml (must be defined
# after nimble_proxy component due to package load order)
# ============================================================================
