# ============================================================================
# Networking Configuration
# ============================================================================
# WiFi base configuration
#
# This module configures:
#   - WiFi connection (reboot_timeout: 0s - see Halo-v1-Core.yaml api: notes)
#   - WireGuard re-handshake on WiFi reconnect
#   - Web server (port 80, firmware upload disabled) and captive portal
#     (AP fallback; still accepts a firmware upload for recovery)
#   - WiFi signal sensor (id: wifi_signal_db)
#   - Startup rainbow LED animation and its "Startup Light Blink" switch
#
# Dependencies (this required module reaches into optional ones):
#   - system/system_management.yaml   ink_ha_connected, sntp_time
#   - features/wireguard/wireguard.yaml   wireguard_enabled, wg0
#   - features/weather/weather_led_effects.yaml   rgb_light
#   - base/globals.yaml   boot_complete, cycleCounter
#   See docs/ARCHITECTURE.md "Known gaps" #2.
#
# CREDENTIALS: the entry file's wifi_ssid / wifi_password substitutions, which
# read !secret wifihome_ssid / wifihome_password (see secrets.yaml.example).
# They are compiled into the firmware image in plain text.
# ============================================================================

# ============================================================================
# WiFi Configuration
# ============================================================================
wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  # 0s = never reboot on WiFi disconnect (default is 15min which wipes the
  # offline history ring buffer just like the API reboot timeout did).
  reboot_timeout: 0s

  # Reset startup light blink when WiFi disconnects
  # This allows the rainbow effect to restart when connection is lost
  on_disconnect:
    - lambda: |-
        id(cycleCounter) = 0;
        ESP_LOGI("wifi", "WiFi disconnected - resetting startup blink counter");

  # Ensure startup blink stops when WiFi reconnects
  on_connect:
    - lambda: |-
        if (id(cycleCounter) < 30) {
          id(cycleCounter) = 30;
          ESP_LOGI("wifi", "WiFi connected - stopping startup blink");
        }
    # Post-boot WiFi reconnect: force a clean WireGuard re-handshake.
    # Only fires after boot_complete to avoid conflicting with the wireguard.yaml
    # on_boot hook (which handles the initial enable with the 20s BLE delay).
    #
    # ROOT CAUSE of reported bug: after an extended WiFi outage the WireGuard
    # component is still "enabled" but stuck — calling wireguard.enable() on an
    # already-enabled instance is a no-op in libwg and never resets the crypto
    # session or restarts handshake initiation.  The fix is to explicitly
    # disable then re-enable so the component performs a fresh handshake
    # initiation with a current timestamp.  Stale timestamps are rejected by
    # the server (WireGuard replay-protection window), which is the likely
    # reason tunnels didn't reconnect after long outages.
    - if:
        condition:
          lambda: 'return id(boot_complete) && id(wireguard_enabled).state;'
        then:
          - if:
              condition:
                lambda: 'return id(sntp_time).now().is_valid();'
              then:
                - logger.log: "WiFi reconnected (post-boot, time valid) - cycling WireGuard for fresh handshake"
                - wireguard.disable:
                    id: wg0
                - delay: 500ms
                - wireguard.enable:
                    id: wg0
              else:
                # SNTP not yet valid (extended outage during boot).
                # on_time_sync in system_management.yaml will call wireguard.enable
                # once SNTP gets its first successful sync over the reconnected WiFi.
                - logger.log: "WiFi reconnected (post-boot, SNTP not yet synced) - WireGuard will be enabled by on_time_sync"

web_server:
  port: 80
  # No firmware upload through the web UI. Its /update endpoint is plain HTTP
  # with no authentication, so anyone on the network could flash the device;
  # the ota: esphome platform (entry files) requires the API key instead.
  # This does not affect the captive portal: in fallback-hotspot mode
  # ("Halo Hotspot") it still accepts a firmware upload, which is the
  # recovery path when the device cannot join WiFi.
  #
  # ESPHome 2026.9.0 still logs "OTA encryption does not cover the web_server
  # OTA platform" during validation. Expected: captive_portal auto-loads that
  # platform, and with ota: false its /update handler only accepts a request
  # while the captive portal is active (web_server/ota/ota_web_server.cpp,
  # USE_WEBSERVER_OTA_DISABLED). The validator does not look at this flag.
  ota: false

captive_portal:

# ============================================================================
# WiFi Signal Sensor
# ============================================================================
# Defined here, in a REQUIRED module, because Halo-v1-Core.yaml references
# id(wifi_signal_db) unconditionally in its 1s WiFi-stats interval. It used to
# live in features/diagnostics/diagnostics.yaml, which is optional and is
# commented out in the published Halo-v1.yaml - so the default configuration
# did not validate.
#
# Name, id and entity_category are unchanged from the previous definition, so
# the Home Assistant entity is identical.
# ============================================================================
sensor:
  - platform: wifi_signal
    name: RSSI
    id: wifi_signal_db
    update_interval: 60s
    entity_category: "diagnostic"

# Note: the WiFi IP address text sensor is defined in the wifi_status
# feature package (features/wifi_status/).

# ============================================================================
# Startup Light Blink Control Switch
# ============================================================================
# Config switch to enable/disable the startup rainbow LED animation.
# Defined here (required module) so networking.yaml intervals can reference it
# even when features/diagnostics/diagnostics.yaml is disabled.
# ============================================================================
switch:
  - platform: template
    name: "Startup Light Blink"
    id: startup_light_blink
    icon: mdi:lightbulb
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"

# ============================================================================
# Startup Light Blink Animation
# ============================================================================
# Rainbow effect while not connected to Home Assistant: at boot, and again
# after every HA disconnect. The interval re-asserts the effect for up to 30 s
# (cycleCounter 0 -> 30); the effect then stays on until Halo-v1-Core.yaml's
# api: on_client_connected restores the user's LED effect. Nothing turns it
# off earlier - a second "turn off at >30" interval could never fire (the
# counter tops out at 30) and was removed; see b63bb58e.
#
# cycleCounter (packages/base/globals.yaml) is reset to 0 by WiFi
# on_disconnect (above) and api: on_client_disconnected (Core), and set to 30
# by WiFi on_connect and api: on_client_connected.
# ============================================================================
interval:
  - interval: 1s
    then:
      - if:
          condition:
            - binary_sensor.is_off: ink_ha_connected
            - lambda: 'return id(cycleCounter) < 30;'
            - switch.is_on: startup_light_blink

          then:
            - light.turn_on:
                id: rgb_light
                effect: "Addressable Rainbow"
            - lambda: 'id(cycleCounter) += 1;'
