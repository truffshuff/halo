# ============================================================================
# Networking Configuration
# ============================================================================
# WiFi base configuration (without WireGuard)
# Dependencies: system/esphome_core.yaml
#
# This module configures:
#   - WiFi connection
#   - Captive portal (AP fallback)
#   - WiFi signal sensor
#
# CREDENTIALS: Stored in device YAML as substitutions or secrets.yaml
#   wifi_ssid: "YourNetworkName"
#   wifi_password: "YourNetworkPassword"
#
# SECURITY: WiFi credentials are stored in plaintext in compiled firmware
#           Use WPA2/WPA3 encryption on your access point
#           Consider using secrets file for sensitive deployments
# ============================================================================

# ============================================================================
# WiFi Configuration
# ============================================================================
wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  # 0s = never reboot on WiFi disconnect (default is 15min which wipes the
  # offline history ring buffer just like the API reboot timeout did).
  reboot_timeout: 0s

  # Reset startup light blink when WiFi disconnects
  # This allows the rainbow effect to restart when connection is lost
  on_disconnect:
    - lambda: |-
        id(cycleCounter) = 0;
        ESP_LOGI("wifi", "WiFi disconnected - resetting startup blink counter");

  # Ensure startup blink stops when WiFi reconnects
  on_connect:
    - lambda: |-
        if (id(cycleCounter) < 30) {
          id(cycleCounter) = 30;
          ESP_LOGI("wifi", "WiFi connected - stopping startup blink");
        }
    # Re-enable WireGuard after WiFi reconnect if the switch is ON and time is
    # already valid. The on_time_sync handler covers the initial boot case where
    # SNTP hasn't synced yet, so we only need to act here when time is ready.
    - if:
        condition:
          lambda: 'return id(wireguard_enabled).state && id(sntp_time).now().is_valid();'
        then:
          - logger.log: "WiFi reconnected - re-enabling WireGuard tunnel"
          - wireguard.enable:
              id: wg0

web_server:
  port: 80

# Note: WiFi signal sensor and IP address sensor are defined in the wifi_status
# feature package (features/wifi_status/).

# ============================================================================
# Startup Light Blink Animation
# ============================================================================
# Rainbow effect runs for 30 seconds when not connected to Home Assistant.
# Uses cycleCounter global (packages/base/globals.yaml) and the
# startup_light_blink switch (features/diagnostics/diagnostics.yaml).
# Controlled by WiFi connection state and HA API connection state.
# ============================================================================
interval:
  # First interval: Turn on rainbow effect for first 30 seconds
  - interval: 1s
    then:
      - if:
          condition:
            - binary_sensor.is_off: ink_ha_connected
            - lambda: 'return id(cycleCounter) < 30;'
            - switch.is_on: startup_light_blink

          then:
            - light.turn_on:
                id: rgb_light
                effect: "Addressable Rainbow"
            - lambda: 'id(cycleCounter) += 1;'

  # Second interval: Turn off light after 30 seconds
  - interval: 1s
    then:
      - if:
          condition:
            - binary_sensor.is_off: ink_ha_connected
            - lambda: 'return id(cycleCounter) > 30;'
            - lambda: 'return id(cycleCounter) < 31;'
            - switch.is_on: startup_light_blink

          then:
            - light.turn_off:
                id: rgb_light
            - lambda: 'id(cycleCounter) += 1;'
