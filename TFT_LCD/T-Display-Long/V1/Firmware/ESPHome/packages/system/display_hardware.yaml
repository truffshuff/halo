# ============================================================================
# Display Hardware Configuration
# ============================================================================
# Display, touchscreen, SPI/I2C buses, backlight
# Dependencies: system/esphome_core.yaml (axs15231 external component);
#   features/page_rotation/page_rotation.yaml (last_auto_rotation_time, reset
#   by on_touch)
#
# This module configures:
#   - Quad-SPI display bus and the two I2C buses (sensors, touch)
#   - Display: core mipi_spi, model AXS15231 (AMOLED, 180x640)
#   - Touchscreen: the fork's axs15231 platform (interrupt-driven)
#   - Backlight OUTPUT (plain GPIO1). The "Display Backlight" light entity on
#     top of it is in features/weather/weather_led_effects.yaml.
#
# Not here, despite the name: the display watchdog and "Recover Display"
# button (features/diagnostics/diagnostics.yaml), and the external_components
# declaration for axs15231 (system/esphome_core.yaml).
# ============================================================================

# ============================================================================
# SPI Bus Configuration
# ============================================================================
# Quad SPI for high-speed display communication
# ============================================================================
spi:
  id: lily_spi
  type: quad
  clk_pin: 17
  data_pins:
    - 13
    - 18
    - 21
    - 14

# ============================================================================
# I2C Bus Configuration
# ============================================================================
# Two I2C buses for sensors and touchscreen
# ============================================================================
i2c:
  - sda: 9
    scl: 48
    id: lily_i2c
  - sda: 15
    scl: 10
    id: touch_i2c
    frequency: 400kHz

# ============================================================================
# Display Output (Backlight)
# ============================================================================
# GPIO backlight control.
# The ESP32-S3/IDF 5.5 LEDC path is crashing on zero-duty updates during boot,
# and this configuration only uses the display backlight as ON/OFF.
# ============================================================================
output:
  - platform: gpio
    pin: 1
    id: backlight
    inverted: false

# Note: the "Display Backlight" light entity (id: display_backlight, a binary
# light on this output) is defined in features/weather/weather_led_effects.yaml
# for historical reasons - it is unrelated to the RGB LED, which is on GPIO47.
# Removing that package removes the backlight entity; the output here still
# works. See docs/ARCHITECTURE.md "Known gaps".

# ============================================================================
# Display Driver - AXS15231 AMOLED
# ============================================================================
# LilyGo T-Display-Long AMOLED display (180x640 pixels)
#
# NOTE (2026.7.0 breaking change #17405): core `mipi_spi` display drivers now
# enforce configuration of mandatory components (PSRAM, I/O expanders) for
# display models that identify a known integrated board. This only affects
# models with recognized hardware assignments; if `esphome compile` starts
# failing validation for this display block after upgrading, check the
# mipi_spi component docs/changelog for what became required for AXS15231.
# ============================================================================
display:
  - platform: mipi_spi
    id: lily_display
    model: AXS15231
    bus_mode: quad
    data_rate: 5MHz
    spi_id: lily_spi
    dimensions:
      height: 640
      width: 180
    cs_pin: 12
    reset_pin: 16
    # rotation is now configured under lvgl: (LVGL v9 breaking change in 2026.4.0)
    auto_clear_enabled: false

# ============================================================================
# Touchscreen Driver - AXS15231
# ============================================================================
# - Interrupt-driven (GPIO11); update_interval: never, so no polling
# - The fork's driver reports single-finger touches only, which filters the
#   phantom touches the panel produces when the backlight turns off
# - on_touch rejects out-of-range coordinates and resets the auto-rotation
#   timer so a page the user is reading is not rotated away
# ============================================================================
touchscreen:
  - platform: axs15231
    id: lily_touch
    display: lily_display
    i2c_id: touch_i2c
    interrupt_pin: GPIO11
    update_interval: never  # Interrupt-driven via interrupt_pin GPIO11; polling not needed
    # transform: removed - LVGL v9 (2026.4.0) handles touch rotation automatically
    on_touch:
      - lambda: |-
          // Validate touch coordinates - filter out spurious/phantom touches
          // (touch.x/y are unsigned, so a `< 0` check is always false and was removed)
          if (touch.x > 180 || touch.y > 640) {
            ESP_LOGW("touch", "Invalid touch coordinates: x=%d, y=%d - ignoring", touch.x, touch.y);
            return;
          }
          ESP_LOGI("touch", "Touch at x=%d, y=%d", touch.x, touch.y);

          // Reset auto-rotation timer on any valid touch to prevent interruption during manual navigation
          id(last_auto_rotation_time) = millis();
          ESP_LOGD("touch", "Auto-rotation timer reset");

# Where the rest of the display plumbing lives:
#   - last_display_update_time, display_recovery_attempts and
#     display_backlight_is_on: packages/base/globals.yaml
#   - display_watchdog_enabled, the "Display Backlight Active" binary sensor,
#     the watchdog intervals and the "Recover Display" button:
#     features/diagnostics/diagnostics.yaml
#   - the lvgl: block that drives lily_display / lily_touch: Halo-v1-Core.yaml
