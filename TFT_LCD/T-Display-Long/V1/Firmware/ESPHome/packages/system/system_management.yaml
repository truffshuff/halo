# ============================================================================
# System Management Configuration
# ============================================================================
# System control, updates, factory reset, time sources
# Dependencies: system/esphome_core.yaml
#
# This module will configure (in Phase 2):
#   - Home Assistant API
#   - Time sources (Home Assistant + SNTP)
#   - HTTP request component
#   - Web server
#   - System buttons (reboot, factory reset)
#   - System sensors (uptime, online status)
# ============================================================================

# ============================================================================
# HTTP Request Component
# ============================================================================
# MUST be defined early because Core scripts use http_request.post action
# Also defined in base/esphome_base.yaml (duplicate is intentional for Phase 1)
# ============================================================================
http_request:
  useragent: esphome/halo
  timeout: 30s  # Increased timeout for large weather responses
  buffer_size_rx: 1024  # 1KB RX buffer; smaller to reduce memory pressure
  buffer_size_tx: 1024  # 1KB transmit buffer for POST requests

# ============================================================================
# Weather Helpers Component
# ============================================================================
# MUST be defined early because Core uses weather_helpers namespace in lambdas
# Provides C++ helper functions for weather icon color calculations
# Also defined in base/hardware.yaml (duplicate is intentional for Phase 1)
# Will move to features/weather/weather_base.yaml in Phase 2
# ============================================================================
weather_helpers:

# ============================================================================
# Time Sources
# ============================================================================
# MUST be defined early because WireGuard component requires time
# Dual time sources for reliability:
#   - Home Assistant (preferred, accurate)
#   - SNTP fallback (when HA unavailable)
# Also defined in base/esphome_base.yaml (duplicate is intentional for Phase 1)
#
# Note: on_time_sync callbacks are in features/clock/clock_base.yaml
#       (time_update script is part of clock feature)
# ============================================================================
time:
  - platform: homeassistant
    id: ha_time
  - platform: sntp
    id: sntp_time
    update_interval: 5min
    timezone: America/New_York
    servers:
      - 10.140.80.1
      - time.cloudflare.com
      - time1.google.com
    on_time_sync:
      then:
        - logger.log: "SNTP synchronized - enabling WireGuard if switch is ON"
        - if:
            condition:
              lambda: 'return id(wireguard_enabled).state;'
            then:
              - wireguard.enable:
                  id: wg0
              - logger.log: "WireGuard enabled by SNTP sync"

# ---------------------------------------------------------------------------
# Diagnostics: ping checks, SNTP validity sensor, HTTP connectivity check,
# periodic diagnostic logging (helps troubleshoot NTP/DNS reachability)
# ---------------------------------------------------------------------------

# Ping reachability tests (binary sensors)
binary_sensor:
  - platform: ping
    host: 1.1.1.1
    name: "Ping 1.1.1.1"
    id: ping_1_1_1_1
    update_interval: 30s

  - platform: ping
    host: time.cloudflare.com
    name: "Ping time.cloudflare.com"
    id: ping_time_cloudflare
    update_interval: 30s

  # Template binary sensor exposing SNTP validity
  - platform: template
    name: "SNTP Time Valid"
    id: sntp_time_valid_sensor
    lambda: "return id(sntp_time).now().is_valid();"
    update_interval: 30s

# Optional numeric sensor exposing SNTP epoch for debugging
sensor:
  - platform: template
    name: "SNTP Timestamp"
    id: sntp_time_timestamp
    lambda: "return (float)id(sntp_time).now().timestamp;"
    update_interval: 30s

# Periodic diagnostic checks and logs
interval:
  - interval: 30s
    then:
      - lambda: |-
          bool sntp_ok = id(sntp_time).now().is_valid();
          ESP_LOGI("sntp_diag", "SNTP valid=%s, ts=%u", sntp_ok ? "yes" : "no", (unsigned)id(sntp_time).now().timestamp);
          ESP_LOGI("net_diag", "Ping 1.1.1.1=%s, time.cloudflare=%s",
                   id(ping_1_1_1_1).state ? "reachable" : "unreachable",
                   id(ping_time_cloudflare).state ? "reachable" : "unreachable");
      - http_request.get:
          url: https://www.google.com/generate_204
          on_response:
            then:
              - logger.log:
                  format: 'HTTP test: status=%d duration=%ums'
                  args:
                    - response->status_code
                    - response->duration_ms
          on_error:
            then:
              - logger.log: 'HTTP test failed (network/DNS unreachable)'
    on_time_sync:
      then:
        - logger.log: "SNTP synchronized - enabling WireGuard if switch is ON"
        - if:
            condition:
              lambda: 'return id(wireguard_enabled).state;'
            then:
              - wireguard.enable:
                  id: wg0
              - logger.log: "WireGuard enabled by SNTP sync"

# Note: Web server, API, and system buttons are defined in
# base/esphome_base.yaml (legacy). They will be moved here in Phase 2.
