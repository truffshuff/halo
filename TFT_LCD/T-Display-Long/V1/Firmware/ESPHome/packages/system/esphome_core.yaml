# ============================================================================
# ESPHome Core Configuration
# ============================================================================
# Core ESP32 hardware and ESPHome configuration
# Dependencies: None
#
# This module configures:
#   - ESP32-S3 board, PSRAM, CPU frequency
#   - ESPHome framework configuration
#   - Memory management (PSRAM, stack sizes)
#   - Logger (base level INFO; device YAML can override with higher verbosity)
# ============================================================================

# ============================================================================
# Logger
# ============================================================================
# Must be declared so logger.log: actions in all packages resolve correctly.
# Device-specific config (e.g., halo-v1-79e384.yaml) can override level/logs.
# ============================================================================
logger:
  level: INFO

# ============================================================================
# External Components
# ============================================================================
# Custom hardware drivers
# MUST be defined early so other modules can use these components
# ============================================================================
external_components:
  # Hardware drivers only. BLE components (nimble_base, nimble_proxy, etc.)
  # are declared in whichever BLE package is active:
  #   ble_improv.yaml  → custom NimBLE stack (truffshuff fork)
  #   ble_esphome.yaml → ESPHome built-in BLE stack (no external components)
  #   ble_stub.yaml    → no BLE
  - source: github://truffshuff/esphome-components@06a7c96957e5b18a58743524b3f779556bf519c8 # Fix bluetooth_set_connection_params template pattern
    components: [axs15231, sy6970, weather_helpers]
    refresh: always

# ============================================================================
# PSRAM Configuration
# ============================================================================
# ESP32-S3 has 8MB external PSRAM (Pseudo Static RAM) for expanded memory.
# This is critical for memory-intensive operations:
#   - BLE/Bluetooth operations
#   - LVGL graphics buffers
#   - 125+ weather sensor entities
#   - Large HTTP response buffering
#
# mode: octal - Uses 8 data lines for maximum bandwidth
# speed: 80MHz - Highest stable speed (120MHz can cause instability with BLE)
# ============================================================================
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false  # Enable larger WiFi buffers

# ============================================================================
# ESP32 Board Configuration
# ============================================================================
api:
  # Note: Buffer sizes for large responses are controlled via ESP-IDF sdkconfig_options below
  # See CONFIG_LWIP_TCP_RCV_WND and CONFIG_LWIP_TCP_SND_BUF
  reboot_timeout: 0s  # Disable automatic reboot on API disconnect
  encryption:
    key: !secret api_encryption_key

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  cpu_frequency: 240MHz  # Maximum performance
  # PSRAM-equipped ESP32 r3.0+ can save ~10KB IRAM by disabling older workarounds
  # See changelog: set only if your module reports minimum_chip_revision >= "3.0"
  

  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 24576
      execute_from_psram: true
      # minimum_chip_revision: "3.0"
    # Use ESPHome-supported framework channels. Options: recommended (default), latest, dev
    # Switch to 'dev' to pick up the very latest ESP-IDF/NimBLE fixes sooner.
    version: recommended
    sdkconfig_options:
      # ============================================================================
      # Memory Management
      # ============================================================================
      # Memory management - allow heap allocation in PSRAM
      CONFIG_SPIRAM_USE_MALLOC: "y"  # Allow malloc() to use PSRAM
      #CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "8192"  # Keep <16KB allocations in internal RAM
      
      # More aggressive PSRAM usage
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"  # Reduce from 8192 to 4096 (only tiny allocations stay in internal RAM)
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "y"  # Use capability allocator
      #CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"  # Move WiFi/LWIP buffers to PSRAM
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"  # Allow BSS segment in PSRAM

      # More aggressive malloc strategy
      CONFIG_SPIRAM_MEMTEST: "n"  # Skip memory test (faster boot, assumes good PSRAM)
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"  # Reserve only 32KB internal (reduce if needed)

      # Move libc allocations to PSRAM (addresses your libc 3.4KB RAM usage)
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"  # Allow stacks in PSRAM (be careful!)


      # Stack size configuration - prevent stack overflow in LVGL updates
      # Default loop task stack is 8192 bytes, increase to handle deep call chains
      # CRITICAL: 64KB required for hourly forecast updates (240+ LVGL label updates in single script)
      # Even with PSRAM-allocated buffers, the deep call chain requires large stack
      # CONFIG_ESP_MAIN_TASK_STACK_SIZE: "24576"  # Main task stack (8x from default 8192) was 65536
      # CONFIG_ARDUINO_LOOP_STACK_SIZE: "24576"   # Arduino loop task stack (8x from 8192) was 65536

      # WiFi buffers to PSRAM (this addresses your wifi_config 7.6KB and wifi_stack 3.6KB)
      #CONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM: "16"  # Increase WiFi RX buffers
      #CONFIG_ESP32_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"  # Increase dynamic RX buffers
      #CONFIG_ESP32_WIFI_DYNAMIC_TX_BUFFER_NUM: "32"  # Increase dynamic TX buffers
      CONFIG_ESP32_WIFI_RX_BA_WIN: "16"  # Block ACK RX window
      CONFIG_ESP32_WIFI_CACHE_TX_BUFFER_NUM: "32"  # Cache TX buffers


      # ============================================================================
      # Network Configuration
      # ============================================================================
      # TCP/IP Configuration for better API throughput
      # CRITICAL: Large buffers needed for:
      # - BLE proxy advertisement bursts
      # - Hourly weather forecast responses (~15-20KB JSON via homeassistant.action)
      # Without these, "Cannot send message because of TCP buffer space" or
      # "BAD_HANDSHAKE_PACKET_LEN errno=11" errors occur
      CONFIG_LWIP_TCP_SND_BUF_DEFAULT: "65535"  # TCP send buffer (64KB max)
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"      # TCP receive window (64KB max)
      CONFIG_LWIP_RECVMBOX_SIZE: "32"           # Mailbox size for recv (doubled from 16)
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "256"    # TCPIP task mailbox (4x from 64)

      # Additional TCP optimizations for BLE proxy traffic
      CONFIG_LWIP_TCP_MSS: "1436"               # Maximum Segment Size (default: 1436)
      CONFIG_LWIP_TCP_OVERSIZE_MSS: "y"         # Allow TCP to send full MSS segments

      # Move TCP/IP stack to PSRAM
      CONFIG_LWIP_TCPIP_TASK_STACK_SIZE: "4096"  # TCPIP task stack
      #CONFIG_LWIP_MEM_USE_POOLS: "y"  # Use memory pools
      #CONFIG_LWIP_MEMP_USE_CUSTOM_POOLS: "y"  # Custom memory pools

      # Watchdog timeout for HTTP operations and JSON parsing
      # Increased from 20s to 30s to accommodate large weather JSON parsing
      # deserializeJson() can block for extended periods on complex data
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
