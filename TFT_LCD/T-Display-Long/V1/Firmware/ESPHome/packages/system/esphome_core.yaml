# ============================================================================
# ESPHome Core Configuration
# ============================================================================
# Core ESP32 hardware and ESPHome configuration
# Dependencies: None
# This module configures:
#   - ESP32-S3 board, PSRAM, CPU frequency
#   - ESPHome framework configuration
#   - Memory management (PSRAM, stack sizes)
#   - Logger (base level INFO; device YAML can override with higher verbosity)
# ============================================================================

# ============================================================================
# Logger
# ============================================================================
# Must be declared so logger.log: actions in all packages resolve correctly.
# Device-specific config (e.g., halo-v1-79e384.yaml) can override level/logs.
# Keep default at INFO to reduce boot-time logging pressure with NimBLE enabled.
# Raise to DEBUG/VERBOSE temporarily only when capturing targeted diagnostics.
# ============================================================================
logger:
  level: INFO

# ============================================================================
# External Components
# ============================================================================
# Custom hardware drivers
# MUST be defined early so other modules can use these components
# ============================================================================
external_components:
  # Hardware drivers only. BLE components (nimble_base, nimble_proxy, etc.)
  # are declared in whichever BLE package is active:
  #   ble_improv.yaml  → custom NimBLE stack (truffshuff fork)
  #   ble_esphome.yaml → ESPHome built-in BLE stack (no external components)
  #   ble_stub.yaml    → no BLE
  - source: github://truffshuff/esphome-components@69b50f3089ee90e130b0f84696c5e41a8a5e316c # ESPHome 2026.9.0 fix: request_bluetooth() + USE_BLUETOOTH_PROXY_CONNECTIONS
    components: [axs15231, sy6970, weather_helpers]
    refresh: always

# ============================================================================
# PSRAM Configuration
# ============================================================================
# ESP32-S3 has 8MB external PSRAM (Pseudo Static RAM) for expanded memory.
# This is critical for memory-intensive operations:
#   - BLE/Bluetooth operations
#   - LVGL graphics buffers
#   - 125+ weather sensor entities
#   - Large HTTP response buffering
#
# mode: octal - Uses 8 data lines for maximum bandwidth
# speed: 80MHz - Highest stable speed (120MHz can cause instability with BLE)
# ============================================================================
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false  # Enable larger WiFi buffers

# ============================================================================
# Home Assistant API - transport security only
# ============================================================================
# OWNERSHIP: this file declares ONLY the encryption key, so the key travels
# with the required system module. Everything else about the API
# (reboot_timeout, connection limits, on_client_connected/disconnected) is
# owned by Halo-v1-Core.yaml. Do not duplicate those keys here - before
# 2026.09 `reboot_timeout` was set in BOTH files and the winner depended on
# package merge order.
#
# TCP buffer sizing is no longer done here. It moved to the supported
# `network:` component below (ESPHome 2026.9.0 `tcp_send_buffer`).
# ============================================================================
api:
  encryption:
    key: !secret api_encryption_key

# ============================================================================
# Network / lwIP tuning (ESPHome 2026.9.0+)
# ============================================================================
# tcp_send_buffer replaces the raw `CONFIG_LWIP_TCP_SND_BUF_DEFAULT` sdkconfig
# override this project used through 2026.8. It is the supported knob and is
# range-checked (2880-65535) at validation time.
#
# WHY 65535: the Bluetooth proxy (features/ble/ble_improv.yaml) bursts
# advertisement batches, and the hourly weather fetch pulls a ~20 KB JSON body.
# Smaller values reproduced "Cannot send message because of TCP buffer space".
#
# MEMORY COST: this is *internal* DRAM - lwIP pbufs are not PSRAM-capable.
# The cost is only paid while a connection actually has data in flight, but it
# is the largest tunable internal-RAM consumer in this configuration.
# If `Free Heap` (diagnostics) runs low, lower this first, in this order:
#   65535 -> 32768 -> 16384, watching the log for "TCP buffer" warnings.
#
# enable_high_performance is pinned to false ON PURPOSE. It is normally
# auto-enabled by components that want throughput (speaker/media_player,
# sendspin). Because this board declares `psram: ignore_not_found: false`,
# ESPHome would treat PSRAM as guaranteed and apply 512 KB TCP windows plus
# 512-deep lwIP mailboxes. That is far more internal DRAM than this device can
# spare. Set to true only if you add an audio component AND have measured the
# heap headroom for it.
# ============================================================================
network:
  enable_high_performance: false
  tcp_send_buffer: 65535

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  # Flash mode/frequency migrated here from Halo-v1.yaml's platformio_options.
  # 2026.7.0 makes native ESP-IDF the default toolchain; board_build.* keys
  # only apply under toolchain: platformio, so these framework-agnostic
  # esp32: keys replace them.
  flash_mode: qio
  flash_frequency: 80MHz
  cpu_frequency: 240MHz  # Default in 2026.4.0 for ESP32-S3; explicit here for clarity
  # NOTE: `minimum_chip_revision:` and `sram1_as_iram:` are documented as
  # "valid only on original ESP32". They do NOT apply to this ESP32-S3 and are
  # deliberately absent. (A previous comment here suggested setting
  # minimum_chip_revision: "3.0" to save IRAM - that advice was for the
  # original ESP32 and would be rejected on this board.)
  # Toolchain: no explicit `toolchain:` set below -> native ESP-IDF (default
  # since 2026.7.0), which picks up ccache and the shared ~/.cache/esphome/idf
  # toolchain cache automatically. To roll back to the previous PlatformIO
  # build, add `toolchain: platformio` here and restore platformio_options in
  # Halo-v1.yaml (see commented block there).

  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 24576
      execute_from_psram: true
      # Signed OTA verification (2026.4.0): verifies firmware signature during OTA
      # without requiring hardware Secure Boot (eFuse burning).
      # To enable: generate a signing key and configure below.
      # See: https://esphome.io/components/esp32#esp32-advanced_configuration
      # signed_ota_verification:
      #   signing_key: secure_boot_signing_key.pem
      #   signing_scheme: rsa3072
    # Use ESPHome-supported framework channels. Options: recommended (default), latest, dev
    # Switch to 'dev' to pick up the very latest ESP-IDF/NimBLE fixes sooner.
    version: recommended
    sdkconfig_options:
      # ========================================================================
      # PSRAM / heap placement
      # ========================================================================
      # Internal DRAM is the scarce resource on this board; PSRAM is not.
      # See docs/MEMORY.md for the full rationale behind every value here.

      CONFIG_SPIRAM_USE_MALLOC: "y"   # route malloc() through the PSRAM-aware allocator

      # Allocations at or above this size are eligible for PSRAM; anything
      # smaller is forced to stay internal. 512 is deliberately low so that
      # medium-sized allocations (TLS contexts, JSON pools, std::string
      # buffers) land in PSRAM instead of internal DRAM.
      # Trade-off: PSRAM is slower than DRAM, so lowering this further would
      # start to cost CPU on hot paths. Do not go below 512 without measuring.
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "512"

      CONFIG_SPIRAM_USE_CAPS_ALLOC: "y"               # expose heap_caps_* PSRAM API
      CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY: "y"  # .bss in PSRAM, frees internal DRAM

      # NOT SET: CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP.
      # Tried and reverted - the WiFi driver needs DMA-capable internal RAM,
      # and forcing it external made free internal heap WORSE, not better.

      # mbedTLS routes every heap call through the PSRAM allocator. This is the
      # targeted fix for TLS setup failures: mbedtls_ssl_setup() plus
      # mbedtls_ctr_drbg_seed() want ~50 KB, which internal DRAM cannot supply.
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"

      CONFIG_SPIRAM_MEMTEST: "n"                      # skip PSRAM test -> faster boot
      # Internal DRAM held back from PSRAM-eligible allocations so that
      # DMA/ISR/WiFi allocations, which MUST be internal, never starve.
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"

      # Permits task stacks in PSRAM. Kept because removing it would push
      # stacks back into internal DRAM. HAZARD: a task whose stack lives in
      # PSRAM must never run while the flash cache is disabled (flash writes,
      # NVS commits). Nothing in this configuration creates such a task today.
      # See docs/MEMORY.md "Known hazards" before adding native components.
      CONFIG_SPIRAM_ALLOW_STACK_EXTERNAL_MEMORY: "y"

      # REMOVED 2026.09: CONFIG_ESP32_WIFI_RX_BA_WIN: "16".
      #
      # In ESP-IDF's Kconfig, RX_BA_WIN and STATIC_RX_BUFFER_NUM default to 16
      # *together*, and only when SPIRAM_TRY_ALLOCATE_WIFI_LWIP is enabled:
      #     default 6  if !(SPIRAM_TRY_ALLOCATE_WIFI_LWIP && !SPIRAM_IGNORE_NOTFOUND)
      #     default 16 if  (SPIRAM_TRY_ALLOCATE_WIFI_LWIP && !SPIRAM_IGNORE_NOTFOUND)
      # This project reverted SPIRAM_TRY_ALLOCATE_WIFI_LWIP (see the note above)
      # but kept RX_BA_WIN at 16, leaving STATIC_RX_BUFFER_NUM at its non-PSRAM
      # default of 10. Espressif's own guidance on STATIC_RX_BUFFER_NUM says it
      # "is recommended to set equal or bigger than ESP_WIFI_RX_BA_WIN in order
      # to achieve better throughput and compatibility with both stations and
      # APs" - so 10 < 16 is the unsupported half of a pairing.
      #
      # Symptoms this produced: healthy RSSI (-58 dBm) and healthy TX
      # (nimble_proxy send_failed=0) but collapsed *inbound* throughput -
      # OTA downloads starving to ~0.6 kB/s and hard DNS failures
      # (getaddrinfo EAI_FAIL) from lost UDP responses.
      #
      # Dropping the override restores the matched IDF default of 6.
      # If inbound throughput ever needs raising, raise BOTH - and note that
      # each static RX buffer costs ~1.6 KB of INTERNAL RAM, so going to 16
      # would spend ~9.6 KB of the scarcest resource on this board.

      # REMOVED 2026.09 - these were no-ops, verified against the generated
      # sdkconfig and the ESP-IDF 5.5 Kconfig:
      #   CONFIG_LWIP_RECVMBOX_SIZE           - no such Kconfig symbol exists
      #   CONFIG_ESP32_WIFI_CACHE_TX_BUFFER_NUM
      #       - real name is CONFIG_ESP_WIFI_CACHE_TX_BUFFER_NUM, and it
      #         depends on SPIRAM_TRY_ALLOCATE_WIFI_LWIP, which is off here
      #   CONFIG_LWIP_TCP_SND_BUF_DEFAULT     - superseded by the supported
      #         `network: tcp_send_buffer:` key declared above

      # ========================================================================
      # Network Configuration
      # ========================================================================
      # TCP receive window. Sized for the largest inbound payload: the hourly
      # weather forecast (~20 KB JSON) and the 140x140 printer cover image.
      # 65535 is the ceiling without TCP window scaling, which is only enabled
      # by high-performance networking (deliberately disabled above).
      # This is internal DRAM. Lower it together with tcp_send_buffer if the
      # `Free Heap` diagnostic sensor gets tight.
      CONFIG_LWIP_TCP_WND_DEFAULT: "65535"

      # TCPIP task mailbox depth. ESP-IDF clamps this to 6..64 unless window
      # scaling is on; the previous value of 256 was silently ignored and the
      # build fell back to the default of 32. 64 is the real maximum here.
      CONFIG_LWIP_TCPIP_RECVMBOX_SIZE: "64"

      CONFIG_LWIP_TCP_MSS: "1436"        # maximum segment size
      CONFIG_LWIP_TCP_OVERSIZE_MSS: "y"  # let lwIP fill whole MSS segments

      # TCPIP task stack (this is a stack size, NOT a PSRAM placement setting -
      # the old comment here claimed it moved the TCP/IP stack to PSRAM, which
      # it never did). Raised from the 3072 default for deeper call chains.
      CONFIG_LWIP_TCPIP_TASK_STACK_SIZE: "4096"

      # ========================================================================
      # Watchdog
      # ========================================================================
      # 30s (default 5s). The hourly-forecast JSON parse and the LVGL page
      # repaint that follows it are the long poles. Lambdas on that path call
      # App.feed_wdt() explicitly; this headroom covers the rest.
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "30"
