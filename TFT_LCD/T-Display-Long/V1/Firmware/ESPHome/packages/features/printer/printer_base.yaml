# ============================================================================
# Cover Image (fetched from Home Assistant REST API via online_image)
# ============================================================================
# Uses the existing ha_url and ha_token substitutions — no extra secrets needed.
# ============================================================================
online_image:
  - id: printer_cover_image_data
    url: "${ha_url}/api/image_proxy/image.${printer_device_id}_cover_image"
    format: PNG
    type: RGB565
    resize: 140x140
    update_interval: 60s
    request_headers:
      Authorization: "Bearer ${ha_token}"
    on_download_finished:
      - logger.log:
          level: DEBUG
          format: "Printer cover image downloaded successfully"
      - if:
          condition:
            lambda: 'return id(current_page_name) == "printer";'
          then:
            - lvgl.image.update:
                id: printer_cover_image_widget
                src: printer_cover_image_data
    on_error:
      - logger.log:
          level: WARN
          format: "Failed to download printer cover image — verify ha_url and ha_token substitutions"
