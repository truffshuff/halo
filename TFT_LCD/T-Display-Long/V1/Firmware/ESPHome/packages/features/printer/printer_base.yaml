# ============================================================================
# 3D Printer Status Capability Module
# ============================================================================
# Displays real-time BambuLab printer status pulled from Home Assistant
#
# FEATURES:
#   - Print status (idle / printing / paused / failed) with color coding
#   - Current task/file name
#   - Print progress percentage + animated progress bar
#   - Remaining time (minutes → formatted Xh Ym)
#   - Estimated end time
#   - Nozzle, bed, and chamber temperatures (active, R, L, bed, chamber)
#   - Current layer number
#   - Print error & HMS error alert banner
#   - Printer name and current stage label
#   - AMS A, AMS B, AMS HT: temperature, humidity, active status, drying status
#   - Page rotation enable/disable
#
# DEPENDENCIES:
#   - system/esphome_core.yaml (ESP32 config, api component)
#   - system/display_hardware.yaml (Display, LVGL)
#   - system/fonts_colors.yaml (color palette, fonts)
#   - page_rotation/page_rotation.yaml (current_page_name global)
#   - Home Assistant integration with BambuLab addon (entities listed below)
#
# SUBSTITUTIONS REQUIRED (set in your device file or Halo-v1.yaml):
#   printer_device_id:  The BambuLab device serial/prefix used in HA entity IDs.
#                       Example: "h2c_31b8ap5c0301590"
#                       All entities are derived as sensor.${printer_device_id}_<suffix>
#
# Entity IDs resolved at compile time (HomeAssistant/dashbaord.yaml for reference):
#   sensor.${printer_device_id}_print_status
#   sensor.${printer_device_id}_print_progress
#   sensor.${printer_device_id}_remaining_time    (hours, float — e.g. 1.3667 = 1h 22m)
#   sensor.${printer_device_id}_end_time          (timestamp/string)
#   sensor.${printer_device_id}_task_name
#   sensor.${printer_device_id}_current_layer
#   sensor.${printer_device_id}_total_layer_count
#   sensor.${printer_device_id}_nozzle_temperature        (active nozzle)
#   sensor.${printer_device_id}_nozzle_target_temperature   (active nozzle target)
#   sensor.${printer_device_id}_right_nozzle_temperature
#   sensor.${printer_device_id}_right_nozzle_target_temperature
#   sensor.${printer_device_id}_left_nozzle_temperature
#   sensor.${printer_device_id}_left_nozzle_target_temperature
#   sensor.${printer_device_id}_bed_temperature
#   sensor.${printer_device_id}_bed_target_temperature
#   sensor.${printer_device_id}_chamber_temperature
#   binary_sensor.${printer_device_id}_print_error
#   binary_sensor.${printer_device_id}_hms_errors
#   image.${printer_device_id}_cover_image  (fetched via ${ha_url} using ${ha_token})
#   sensor.${printer_device_id}_printer_name
#   sensor.${printer_device_id}_current_stage
#   sensor.${printer_device_id}_ams_a_temperature
#   sensor.${printer_device_id}_ams_a_humidity
#   sensor.${printer_device_id}_ams_a_remaining_drying_time
#   binary_sensor.${printer_device_id}_ams_a_active
#   binary_sensor.${printer_device_id}_ams_a_drying
#   sensor.${printer_device_id}_ams_b_temperature
#   sensor.${printer_device_id}_ams_b_humidity
#   sensor.${printer_device_id}_ams_b_remaining_drying_time
#   binary_sensor.${printer_device_id}_ams_b_active
#   binary_sensor.${printer_device_id}_ams_b_drying
#   sensor.${printer_device_id}_ams_ht_temperature
#   sensor.${printer_device_id}_ams_ht_humidity
#   sensor.${printer_device_id}_ams_ht_remaining_drying_time
#   binary_sensor.${printer_device_id}_ams_ht_active
#   binary_sensor.${printer_device_id}_ams_ht_drying
#
# EXISTING SUBSTITUTIONS USED (no extra secrets needed):
#   ha_url    — already required for weather; e.g. http://homeassistant.local:8123
#   ha_token  — long-lived access token, already required for weather
#
# MEMORY USAGE: ~7KB (extra ~38KB PSRAM for decoded cover image buffer)
# ============================================================================

# ============================================================================
# Global Variables
# ============================================================================
globals:
  # Page rotation configuration
  - id: page_rotation_printer_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'

  - id: page_rotation_printer_order
    type: int
    restore_value: yes
    initial_value: '8'

  # ---- Label text cache (avoids redundant LVGL re-renders) ----
  - id: printer_status_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  - id: printer_task_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  - id: printer_progress_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  - id: printer_progress_bar_last_value
    type: float
    restore_value: no
    initial_value: '0.0'

  - id: printer_remaining_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  - id: printer_endtime_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  - id: printer_nozzle_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  - id: printer_bed_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  - id: printer_chamber_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  - id: printer_layer_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  - id: printer_error_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  # Cached total layer count (numeric) — combined with current layer for X/Y display
  - id: printer_total_layer_value
    type: int
    restore_value: no
    initial_value: '0'

  # Cached right nozzle target — combined with current for Actual/Target display
  - id: printer_nozzle_target_value
    type: float
    restore_value: no
    initial_value: '0.0'

  # Left nozzle display text cache
  - id: printer_left_nozzle_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  # Cached left nozzle target — combined with current for Actual/Target display
  - id: printer_left_nozzle_target_value
    type: float
    restore_value: no
    initial_value: '0.0'

  # Right nozzle display text cache
  - id: printer_right_nozzle_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  # Cached right nozzle target — combined with current for R: Actual/Target display
  - id: printer_right_nozzle_target_value
    type: float
    restore_value: no
    initial_value: '0.0'

  # Cached bed target — combined with current bed temp for Bed: Actual/Target display
  - id: printer_bed_target_value
    type: float
    restore_value: no
    initial_value: '0.0'

  # Printer display name (from HA entity, shown at top of page)
  - id: printer_name_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  # Current printer stage (e.g. "Printing", "Heatbed Preheating", "Idle")
  - id: printer_stage_last_text
    type: std::string
    restore_value: no
    initial_value: ""

  # ---- AMS / AMS HT intermediate value caches ----
  # Each unit stores temp, humidity, remaining drying time, active flag, and drying flag.
  # These are combined into a single display string per unit whenever any value fires.
  - id: ams_a_temp_val
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ams_a_humidity_val
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ams_a_drying_time_val
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ams_a_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ams_a_is_drying
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ams_a_last_text
    type: std::string
    restore_value: no
    initial_value: '"A: --"'

  - id: ams_b_temp_val
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ams_b_humidity_val
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ams_b_drying_time_val
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ams_b_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ams_b_is_drying
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ams_b_last_text
    type: std::string
    restore_value: no
    initial_value: '"B: --"'

  - id: ams_ht_temp_val
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ams_ht_humidity_val
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ams_ht_drying_time_val
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: ams_ht_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ams_ht_is_drying
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: ams_ht_last_text
    type: std::string
    restore_value: no
    initial_value: '"HT: --"'

  # ---- Render-dirty flags ----
  - id: printer_status_needs_render
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: printer_progress_needs_render
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: printer_temps_needs_render
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: printer_detail_needs_render
    type: bool
    restore_value: no
    initial_value: 'false'

# ============================================================================
# Switch Components
# ============================================================================
switch:
  # Enable/disable printer page in the auto-rotation cycle
  - platform: template
    name: "Page Rotation: 3D Printer Page"
    id: page_rotation_printer_switch
    icon: mdi:printer-3d
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      - lambda: 'id(page_rotation_printer_enabled) = true;'
      - logger.log: "Printer page enabled in rotation"
    on_turn_off:
      - lambda: 'id(page_rotation_printer_enabled) = false;'
      - logger.log: "Printer page disabled in rotation"

# ============================================================================
# Number Components
# ============================================================================
number:
  # Printer page position in the rotation sequence
  - platform: template
    name: "Page Order: 3D Printer Page"
    id: page_order_printer
    icon: mdi:numeric
    restore_value: true
    initial_value: 8
    min_value: 1
    max_value: 8
    entity_category: "config"
    optimistic: true
    step: 1
    mode: box
    on_value:
      - lambda: 'id(page_rotation_printer_order) = (int)x;'
      - logger.log:
          format: "Printer page order set to %d"
          args: ['(int)x']

# ============================================================================
# Button Components
# ============================================================================
button:
  # Navigate directly to the 3D Printer page from Home Assistant
  - platform: template
    name: "Go to 3D Printer Page"
    id: goto_printer_page
    icon: mdi:printer-3d
    on_press:
      - logger.log: "Navigating to 3D Printer page"
      - lambda: |-
          id(current_page_name) = "printer";
          id(last_auto_rotation_time) = millis();
      - lvgl.page.show:
          id: printer_page
          animation: OUT_LEFT
          time: 300ms

# ============================================================================
# Home Assistant Sensor Subscriptions (numeric)
# ============================================================================
sensor:
  # --- Print Progress (0–100 %) ---
  - platform: homeassistant
    id: printer_progress_sensor
    entity_id: sensor.${printer_device_id}_print_progress
    name: "Print Progress"
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) return;
            char buf[12];
            snprintf(buf, sizeof(buf), "%.0f%%", x);
            std::string s(buf);
            if (s != id(printer_progress_last_text) ||
                x != id(printer_progress_bar_last_value)) {
              id(printer_progress_last_text) = s;
              id(printer_progress_bar_last_value) = x;
              id(printer_progress_needs_render) = true;
            }
        - if:
            condition:
              lambda: 'return id(printer_progress_needs_render) && id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_progress_label
                  text: !lambda 'return id(printer_progress_last_text);'
              - lvgl.bar.update:
                  id: printer_progress_bar
                  value: !lambda 'return (int)id(printer_progress_bar_last_value);'
              - lambda: 'id(printer_progress_needs_render) = false;'

  # --- Remaining Time (minutes, numeric) ---
  - platform: homeassistant
    id: printer_remaining_sensor
    entity_id: sensor.${printer_device_id}_remaining_time
    name: "Print Remaining Time"
    internal: true
    on_value:
      then:
        - lambda: |-
            // HA entity is in hours (float), e.g. 1.3667 = 1h 22m
            if (std::isnan(x) || x <= 0) {
              if ("" != id(printer_remaining_last_text)) {
                id(printer_remaining_last_text) = "";
                id(printer_detail_needs_render) = true;
              }
              return;
            }
            int total_minutes = (int)round(x * 60.0f);
            int hours = total_minutes / 60;
            int mins  = total_minutes % 60;
            char buf[32];
            if (hours > 0)
              snprintf(buf, sizeof(buf), "Remaining: %dh %dm", hours, mins);
            else
              snprintf(buf, sizeof(buf), "Remaining: %dm", mins);
            std::string s = buf;
            if (s != id(printer_remaining_last_text)) {
              id(printer_remaining_last_text) = s;
              id(printer_detail_needs_render) = true;
            }
        - if:
            condition:
              lambda: 'return id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_remaining_label
                  text: !lambda 'return id(printer_remaining_last_text);'

  # --- Right Nozzle Temperature ---
  - platform: homeassistant
    id: printer_nozzle_temp
    entity_id: sensor.${printer_device_id}_nozzle_temperature
    name: "Printer Active Nozzle Temp"
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) return;
            char buf[32];
            float tgt = id(printer_nozzle_target_value);
            if (tgt > 0) {
              snprintf(buf, sizeof(buf), "Active: %.0f/%.0f\xC2\xB0", x, tgt);
            } else {
              snprintf(buf, sizeof(buf), "Active: %.0f\xC2\xB0", x);
            }
            std::string s(buf);
            if (s != id(printer_nozzle_last_text)) {
              id(printer_nozzle_last_text) = s;
              id(printer_temps_needs_render) = true;
            }
        - if:
            condition:
              lambda: 'return id(printer_temps_needs_render) && id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_nozzle_label
                  text: !lambda 'return id(printer_nozzle_last_text);'
              - lambda: 'id(printer_temps_needs_render) = false;'

  # --- Active Nozzle Target Temperature ---
  - platform: homeassistant
    id: printer_nozzle_target_temp
    entity_id: sensor.${printer_device_id}_nozzle_target_temperature
    name: "Printer Active Nozzle Target"
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) return;
            id(printer_nozzle_target_value) = x;
            float cur = id(printer_nozzle_temp).state;
            if (std::isnan(cur)) return;
            char buf[32];
            if (x > 0) {
              snprintf(buf, sizeof(buf), "Active: %.0f/%.0f\xC2\xB0", cur, x);
            } else {
              snprintf(buf, sizeof(buf), "Active: %.0f\xC2\xB0", cur);
            }
            id(printer_nozzle_last_text) = std::string(buf);
            id(printer_temps_needs_render) = true;
        - if:
            condition:
              lambda: 'return id(printer_temps_needs_render) && id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_nozzle_label
                  text: !lambda 'return id(printer_nozzle_last_text);'
              - lambda: 'id(printer_temps_needs_render) = false;'

  # --- Left Nozzle Temperature ---
