# ============================================================================
# Home Assistant Text Sensor Subscriptions
# ============================================================================
text_sensor:
  # --- Print Status ("idle", "printing", "pause", "failed", "finish", ...) ---
  - platform: homeassistant
    id: printer_status_text
    entity_id: sensor.${printer_device_id}_print_status
    name: "Print Status"
    internal: true
    on_value:
      then:
        - lambda: |-
            // Capitalise first letter for display
            std::string raw = x;
            if (!raw.empty()) raw[0] = toupper((unsigned char)raw[0]);
            std::string s = "Status: " + raw;
            if (s != id(printer_status_last_text)) {
              id(printer_status_last_text) = s;
              id(printer_status_needs_render) = true;
            }
        - if:
            condition:
              lambda: 'return id(printer_status_needs_render) && id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_status_label
                  text: !lambda 'return id(printer_status_last_text);'
                  text_color: !lambda |-
                    std::string val = x;
                    if (val == "printing" || val == "running") return id(my_green);
                    if (val == "pause" || val == "paused")     return id(my_orange);
                    if (val == "failed"  || val == "error")    return id(my_red);
                    if (val == "finish"  || val == "finished") return id(my_teal);
                    return id(my_gray);
              - lambda: 'id(printer_status_needs_render) = false;'

  # --- Task / File Name ---
  - platform: homeassistant
    id: printer_task_name
    entity_id: sensor.${printer_device_id}_task_name
    name: "Print Task Name"
    internal: true
    on_value:
      then:
        - lambda: |-
            // Truncate long filenames to fit the narrow display (≈22 chars at 14pt)
            std::string s = (x.length() > 22) ? x.substr(0, 19) + "..." : x;
            if (s != id(printer_task_last_text)) {
              id(printer_task_last_text) = s;
              id(printer_detail_needs_render) = true;
            }
        - if:
            condition:
              lambda: 'return id(printer_detail_needs_render) && id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_task_label
                  text: !lambda 'return id(printer_task_last_text);'
              - lambda: 'id(printer_detail_needs_render) = false;'

  # --- Estimated End Time (datetime string from HA) ---
  - platform: homeassistant
    id: printer_end_time
    entity_id: sensor.${printer_device_id}_end_time
    name: "Print End Time"
    internal: true
    on_value:
      then:
        - lambda: |-
            // HA datetime sensor state is ISO 8601; extract HH:MM for display
            std::string raw = x;
            std::string time_part = raw;
            // Format: "2026-03-21T14:30:00+00:00" — extract chars at index 11..15
            if (raw.length() >= 16 && raw[10] == 'T') {
              time_part = raw.substr(11, 5);  // "HH:MM"
            }
            std::string s = "Done: " + time_part;
            if (s != id(printer_endtime_last_text)) {
              id(printer_endtime_last_text) = s;
            }
        - if:
            condition:
              lambda: 'return id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_endtime_label
                  text: !lambda 'return id(printer_endtime_last_text);'

  # --- Print Error (binary_sensor exposed as text: "on" / "off") ---
  - platform: homeassistant
    id: printer_error_sensor
    entity_id: binary_sensor.${printer_device_id}_print_error
    name: "Print Error Flag"
    internal: true
    on_value:
      then:
        - lambda: |-
            bool err = (x == "on");
            std::string s = err ? "! PRINT ERROR !" : "";
            if (s != id(printer_error_last_text)) {
              id(printer_error_last_text) = s;
            }
        - if:
            condition:
              lambda: 'return id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_error_label
                  text: !lambda 'return id(printer_error_last_text);'
                  text_color: !lambda 'return (x == "on") ? id(my_red) : id(my_black);'

  # --- HMS Errors (AMS / filament system errors) ---
  - platform: homeassistant
    id: printer_hms_error_sensor
    entity_id: binary_sensor.${printer_device_id}_hms_errors
    name: "HMS Error Flag"
    internal: true
    on_value:
      then:
        - lambda: |-
            // If both print_error and hms_error are on, prefer print_error message.
            // Only override the error label content when hms fires.
            bool hms_err = (x == "on");
            if (!hms_err && id(printer_error_last_text) == "! HMS ERROR !") {
              id(printer_error_last_text) = "";
            } else if (hms_err && id(printer_error_last_text).empty()) {
              id(printer_error_last_text) = "! HMS ERROR !";
            }
        - if:
            condition:
              lambda: 'return id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_error_label
                  text: !lambda 'return id(printer_error_last_text);'
                  text_color: !lambda 'return (x == "on") ? id(my_red) : id(my_black);'

  # --- Printer Name (displayed at top of printer page) ---
  - platform: homeassistant
    id: printer_name_sensor
    entity_id: sensor.${printer_device_id}_printer_name
    name: "Printer Name"
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x.empty() || x == id(printer_name_last_text)) return;
            id(printer_name_last_text) = x;
        - if:
            condition:
              lambda: 'return id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_name_label
                  text: !lambda 'return id(printer_name_last_text);'

  # --- Current Stage (e.g. "Printing", "Heatbed Preheating", "Changing Filament") ---
  - platform: homeassistant
    id: printer_current_stage
    entity_id: sensor.${printer_device_id}_current_stage
    name: "Printer Current Stage"
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x == id(printer_stage_last_text)) return;
            id(printer_stage_last_text) = x;
        - if:
            condition:
              lambda: 'return id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_stage_label
                  text: !lambda 'return id(printer_stage_last_text);'

  # ==========================================================================
  # AMS / AMS HT Active & Drying binary sensors
  # ==========================================================================
  # binary_sensor entities come through the HA text_sensor platform as "on"/"off".
  # Each handler updates the bool cache and rebuilds the unit's display string.
  # ==========================================================================

  # --- AMS A ---
  - platform: homeassistant
    id: ams_a_active_sensor
    entity_id: binary_sensor.${printer_device_id}_ams_a_active
    name: "AMS A Active"
    internal: true
    on_value:
      then:
        - lambda: |-
            id(ams_a_active) = (x == "on");
            char buf[48];
            float t = id(ams_a_temp_val);
            float h = id(ams_a_humidity_val);
            float dt = id(ams_a_drying_time_val);
            bool drying = id(ams_a_is_drying);
            bool active = (x == "on");
            if (drying && dt > 0) snprintf(buf, sizeof(buf), "A: %.0f\xC2\xB0  %.0f%%  DRY %dm", t, h, (int)dt);
            else if (drying)      snprintf(buf, sizeof(buf), "A: %.0f\xC2\xB0  %.0f%%  DRY", t, h);
            else if (active)      snprintf(buf, sizeof(buf), "A: %.0f\xC2\xB0  %.0f%%  >", t, h);
            else                  snprintf(buf, sizeof(buf), "A: %.0f\xC2\xB0  %.0f%%", t, h);
            id(ams_a_last_text) = std::string(buf);
        - if:
            condition:
              lambda: 'return id(current_page_name) == "printer";'
            then:
              - lvgl.label.update:
                  id: printer_ams_a_label
                  text: !lambda 'return id(ams_a_last_text);'

  - platform: homeassistant
    id: ams_a_drying_sensor
    entity_id: binary_sensor.${printer_device_id}_ams_a_drying
    name: "AMS A Drying"
    internal: true
    on_value:
