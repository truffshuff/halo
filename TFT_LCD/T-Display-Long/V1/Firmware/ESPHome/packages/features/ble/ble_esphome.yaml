# ============================================================================
# BLE WiFi Provisioning - ESPHome Native Stack (Bluedroid)
# ============================================================================
# Alternative to ble_improv.yaml using ESPHome's built-in BLE components
# instead of the custom NimBLE components.
#
# Stack difference:
#   ble_esphome.yaml  → Bluedroid (ESP32 default; required by esp32_ble_tracker)
#   ble_improv.yaml   → NimBLE    (custom components; lower memory footprint)
#
# Why try this instead of ble_improv.yaml?
#   - ESPHome's Bluedroid BLE management has received memory improvements
#   - No custom external_components to fetch
#   - Stays in sync with upstream ESPHome BLE fixes automatically
#   - Maintained by the ESPHome project
#
# Trade-offs vs ble_improv.yaml (custom NimBLE):
#   - ble_scanner_switch is a template switch (optimistic), not a native proxy switch
#   - Bluedroid uses more internal RAM than NimBLE (see MEMORY IMPACT)
#   - bluetooth_proxy defaults to connection_slots: 3 and cache_services: true
#     (Bluedroid NVS service cache); ble_improv.yaml runs connection_slots: 1.
#     Both are tunable on bluetooth_proxy below if needed.
#
# Dependencies:
#   - system/esphome_core.yaml (PSRAM and base configuration)
#   - system/networking.yaml (provisions WiFi)
#
# This module configures:
#   - ESPHome native BLE tracker (BLE scanning for HA proxy)
#   - Improv WiFi provisioning via BLE (esp32_improv)
#   - Bluetooth proxy for Home Assistant (built-in ESPHome component)
#   - Scanner switch to pause/resume BLE scanning (OTA, weather fetches)
#
# MEMORY IMPACT (internal SRAM):
#   Measured 2026-09-22 on one unit, swapping ble_improv.yaml for this package
#   *before* the PSRAM options below existed:
#     Min Free Heap Ever   ~63 KB with ble_improv.yaml (NimBLE, 1 slot)
#                          ~40 KB with this package    (Bluedroid, 3 slots)
#   Without help, Bluedroid keeps its host environment tables as static arrays
#   in internal DRAM. esp32_ble use_psram + CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST
#   (both below) make them heap allocations and route those to PSRAM. How much
#   of the ~23 KB that recovers on this board is NOT yet measured.
#   Flash: Bluedroid is larger than NimBLE; PSRAM: host tables once moved.
# ============================================================================

# ============================================================================
# BT sdkconfig - Bluedroid BLE stack
# ============================================================================
# ESPHome's native esp32_ble_tracker and bluetooth_proxy are Bluedroid-based.
# They include esp_bt_defs.h which is only available when Bluedroid is enabled.
# (The custom nimble_proxy in ble_improv.yaml is the NimBLE alternative.)
#
# BLE-only (no Classic BR/EDR): Bluedroid + BLE_ENABLED + GATT on,
# Classic BT features off.
# ============================================================================
esp32:
  framework:
    sdkconfig_options:
      # Enable Bluedroid, disable NimBLE
      CONFIG_BT_ENABLED: "y"
      CONFIG_BT_BLUEDROID_ENABLED: "y"
      CONFIG_BT_NIMBLE_ENABLED: "n"

      # BLE only — no Classic Bluetooth (BR/EDR)
      CONFIG_BT_CLASSIC_ENABLED: "n"      # Disable BR/EDR
      CONFIG_BT_BLE_ENABLED: "y"          # Enable Bluedroid BLE
      CONFIG_BT_SPP_ENABLED: "n"          # Serial Port Profile
      CONFIG_BT_HFP_ENABLE: "n"           # Hands-Free Profile
      CONFIG_BT_A2DP_ENABLE: "n"          # Advanced Audio Distribution Profile
      CONFIG_BT_BLUFI_ENABLE: "n"         # BluFi WiFi provisioning

      # GATT required for proxy (client) and Improv (server)
      CONFIG_BT_GATTS_ENABLE: "y"         # GATT Server (Improv provisioning)
      CONFIG_BT_GATTC_ENABLE: "y"         # GATT Client (active proxy connections)

      CONFIG_BT_RELEASE_IRAM_ON_SLEEP: "n"  # Keep BT memory accessible

      # Bluedroid host allocations go to PSRAM first, internal as fallback.
      # esp32_ble use_psram (below) sets this only on the original ESP32, on
      # the claim that BLE-only chips (S3, C3, ...) lack the Kconfig symbol.
      # That is not true of ESP-IDF 5.5.5: BT_ALLOCATION_FROM_SPIRAM_FIRST
      # depends only on BT_BLUEDROID_ENABLED, and osi_malloc()/osi_calloc()
      # use heap_caps_malloc_prefer(SPIRAM, then INTERNAL) on every chip
      # (components/bt/common/osi/include/osi/allocator.h). So the S3 has to
      # set it here. Controller memory is unaffected - it stays internal.
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"

# ============================================================================
# Bluedroid memory placement
# ============================================================================
# use_psram sets CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY on every chip: Bluedroid's
# host environment tables become heap allocations instead of static arrays in
# internal DRAM. Combined with ALLOCATION_FROM_SPIRAM_FIRST above, that heap
# is PSRAM. Needs the psram: component (esphome_core.yaml provides it).
# dump_config confirms it at boot: "PSRAM BLE allocation: enabled".
# ============================================================================
esp32_ble:
  use_psram: true

# ============================================================================
# ESPHome Native BLE Tracker
# ============================================================================
# Drives BLE scanning used by the bluetooth_proxy below.
# active: true enables active scan (requests scan response packets).
# Tune interval/window to balance scan coverage vs. power/CPU load.
# ============================================================================
# WARNING (ESPHome 2026.9.0): a scan window above 600ms with WiFi enabled now
# produces a validation warning (esphome#18725), and esphome#18356 documents
# missed BLE advertisements in exactly this regime on ESP-IDF 5.5.5. The 100%
# duty cycle below starves WiFi of radio time. If you enable this package,
# reduce the window first - e.g. interval: 320ms / window: 60ms, which is what
# features/ble/ble_improv.yaml uses (scan_interval 512 / scan_window 96, in
# 0.625ms units). The values here are left unchanged only because this package
# is not the active BLE option and changing them untested would be worse.
esp32_ble_tracker:
  id: ble_tracker
  scan_parameters:
    active: true
    interval: 1100ms   # Time between scan windows (duty cycle)
    window: 1100ms     # How long to listen per interval (100% duty cycle here)

# ============================================================================
# ESPHome Native Bluetooth Proxy
# ============================================================================
# Allows Home Assistant to use this device as a Bluetooth proxy.
# active: true enables outbound GATT connections (connect to BLE devices).
# NOTE: connection_slots and cache_services are not available in the native
# component; ESPHome manages connection limits internally.
# ============================================================================
bluetooth_proxy:
  active: true

# ============================================================================
# Improv WiFi Provisioning (ESPHome native)
# ============================================================================
# Allows WiFi reconfiguration via BLE using the Improv protocol.
#
# esp32_improv requires an authorizer binary_sensor — it checks this sensor
# to decide whether to accept provisioning requests. We define an internal
# always-on sensor (ble_improv_authorizer) so provisioning is auto-approved
# on connection, matching the nimble_improv behavior in ble_improv.yaml.
#
# To require a physical button press instead: replace the template sensor
# with a real button/GPIO binary_sensor.
#
# authorized_duration and wifi_timeout ARE supported by esp32_improv and
# are set here to match the values in ble_improv.yaml.
# ============================================================================
binary_sensor:
  - platform: template
    id: ble_improv_authorizer
    internal: true   # Not exposed to Home Assistant
    lambda: "return true;"  # Always authorized — no button press required

esp32_improv:
  authorizer: ble_improv_authorizer
  authorized_duration: 2min  # Match ble_improv.yaml
  wifi_timeout: 1min         # Match ble_improv.yaml

# ============================================================================
# BLE Scanner Control Switch
# ============================================================================
# Pause/resume BLE scanning during OTA updates and weather fetches.
# Uses a template switch calling esp32_ble_tracker.start_scan / stop_scan.
# optimistic: true means the switch state is trusted immediately.
#
# Note: esp32_ble_tracker starts automatically on boot. The on_turn_on
# action (via RESTORE_DEFAULT_ON) calls start_scan after all components are
# already initialized, so it safely restarts the scan cycle rather than
# conflicting with startup.
# ============================================================================
switch:
  - platform: template
    id: ble_scanner_switch
    name: "BLE Scanner"
    icon: mdi:bluetooth-audio
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"
    optimistic: true
    on_turn_on:
      - esp32_ble_tracker.start_scan:
          id: ble_tracker
          continuous: true
    on_turn_off:
      - esp32_ble_tracker.stop_scan:
          id: ble_tracker
