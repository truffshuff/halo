# ============================================================================
# BLE WiFi Provisioning Capability - Custom NimBLE Stack
# ============================================================================
# Custom NimBLE components + Improv WiFi provisioning
# Dependencies:
#   - system/esphome_core.yaml (PSRAM needed for BLE)
#   - system/networking.yaml (provisions WiFi)
#
# This module configures:
#   - Custom NimBLE Bluetooth stack (from truffshuff/esphome-components)
#   - Improv WiFi provisioning service
#   - Bluetooth proxy for Home Assistant (custom nimble_proxy)
#   - Startup RGB LED blink animation
#
# Features:
#   - Complete GATT service with all 5 Improv characteristics
#   - BLE advertising as "Halo Improv" with Improv service UUID
#   - WiFi provisioning flow (receive credentials → connect → send IP)
#   - Auto-authorization on connection (no button press required)
#   - Device info response (firmware, version, hardware, name)
#   - State management and error handling
#   - connection_slots: tunable active GATT connection count
#   - cache_services: NVS service caching
#   - authorized_duration / wifi_timeout on improv
#
# Usage:
#   1. Open https://www.improv-wifi.com/ in Chrome browser
#   2. Click "Connect device via Improv"
#   3. Select "Halo Improv" from BLE devices
#   4. Enter WiFi credentials and provision
#
# Alternative: Use ble_esphome.yaml for ESPHome's built-in BLE stack
# (fewer features but tracks upstream ESPHome memory improvements)
#
# Compatible with standard Improv protocol clients
# Protocol spec: https://www.improv-wifi.com/
#
# MEMORY IMPACT: ~40KB (BLE stack)
# ============================================================================

# Note: cycleCounter global remains in base/globals.yaml due to load order dependency
# It's used by both networking.yaml (WiFi events) and this BLE module (LED effects)
# Since networking.yaml loads before this module, cycleCounter cannot be moved here

# ============================================================================
# Custom NimBLE External Components
# ============================================================================
# The custom NimBLE component set lives in the truffshuff fork.
# These are NOT needed when using ble_esphome.yaml.
# esphome_core.yaml only registers the hardware drivers (axs15231, sy6970,
# weather_helpers); BLE components are declared here so swapping BLE files
# is the only change required.
# ============================================================================
external_components:
  - source: github://truffshuff/esphome-components@9d16300e3e91dc91e0cb8b1a7473c7e547a4392f
    components: [nimble_base, nimble_proxy, bluetooth_proxy, nimble_improv]
    refresh: always
    # Compatible with ESP-IDF 5.5.x (ESPHome >= 2026.3.0):
    # - ble_hs_cfg callbacks now set before nimble_port_init() to prevent race
    # - nimble_port_freertos_init() guarded for IDF < 5.5 to avoid duplicate task
    # - WiFi global null-checked in load_saved_credentials_() to prevent crash on boot
    # - adv_buffer_ allocation deferred to add_advertisement_() (lazy init)
    #   to avoid crashing during setup() before API globals are ready

# ============================================================================
# NimBLE sdkconfig Options
# ============================================================================
# These options tune the NimBLE stack.  They live here so that switching to
# ble_esphome.yaml (which sets its own BT sdkconfig) requires no edits to
# esphome_core.yaml.
# ============================================================================
esp32:
  framework:
    sdkconfig_options:
      # Enable NimBLE, disable Bluedroid
      CONFIG_BT_ENABLED: "y"
      CONFIG_BT_NIMBLE_ENABLED: "y"
      CONFIG_BT_BLUEDROID_ENABLED: "n"

      # Explicitly disable ALL Bluedroid sub-components to prevent compilation
      # This fixes "esp_bt_defs.h: No such file or directory" errors
      CONFIG_BT_BLE_ENABLED: "n"           # Bluedroid BLE (not NimBLE BLE)
      CONFIG_BT_CLASSIC_ENABLED: "n"       # Classic Bluetooth (BR/EDR)
      CONFIG_BT_SPP_ENABLED: "n"           # Serial Port Profile
      CONFIG_BT_HFP_ENABLE: "n"            # Hands-Free Profile
      CONFIG_BT_A2DP_ENABLE: "n"           # Advanced Audio Distribution Profile
      CONFIG_BT_BLUFI_ENABLE: "n"          # BluFi WiFi provisioning (causes esp_blufi_api.c errors)
      CONFIG_BT_GATTS_ENABLE: "n"          # GATT Server (Bluedroid)
      CONFIG_BT_GATTC_ENABLE: "n"          # GATT Client (Bluedroid)

      # NimBLE tuning (working with nimble_proxy)
      CONFIG_BT_NIMBLE_MAX_CONNECTIONS: "3"
      CONFIG_BT_NIMBLE_ROLE_CENTRAL: "y"
      CONFIG_BT_NIMBLE_ROLE_PERIPHERAL: "y"
      CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL: "y"  # Use PSRAM
      CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE: "8192"  # Correct key (was TASK_STACK_SIZE); 8KB for safety
      CONFIG_BT_RELEASE_IRAM_ON_SLEEP: "n"            # Keep BT memory accessible

      # Increase ATT MTU (browser commonly negotiates 185/247)
      CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU: "247"
      # Allow more concurrent GATT procedures and prep entries
      CONFIG_BT_NIMBLE_GATT_MAX_PROCS: "16"
      CONFIG_BT_NIMBLE_GATT_PREP_WRITE_COUNT: "16"
      # More CCCDs (we have multiple notifies)
      CONFIG_BT_NIMBLE_MAX_CCCDS: "16"
      # NimBLE debug logging
      CONFIG_BT_NIMBLE_LOG_LEVEL: "DEBUG"

# ============================================================================
# NimBLE Base Stack
# ============================================================================
# Base NimBLE stack - required before nimble_improv can be used
# ============================================================================
nimble_base:

# ============================================================================
# NimBLE Improv WiFi Provisioning
# ============================================================================
# Allows WiFi reconfiguration via BLE using the Improv protocol
# Uses ESP-IDF native NimBLE stack for compatibility with nimble_proxy
# ============================================================================
nimble_improv:
  authorized_duration: 2min  # How long authorization lasts
  wifi_timeout: 1min         # Timeout for WiFi connection attempts

# ============================================================================
# Bluetooth Proxy for Home Assistant
# ============================================================================
# Allows Home Assistant to use this device as a Bluetooth proxy
# CRITICAL: Advertisement throttling prevents TCP buffer overflow and crashes
# Without these limits, BLE bursts cause "Cannot send message" errors
# and protocol buffer assertion failures (proto.h:820)
#
# Rate limiting is controlled via nimble_proxy max_connections below
# The increased TCP buffers in esphome_core.yaml handle advertisement bursts
# ============================================================================
bluetooth_proxy:

nimble_proxy:
  id: nimble_proxy_component
  active: true
  connection_slots: 3  # supports active GATT connections
  cache_services: true  # NVS service caching implemented
  # Now supports:
  # - Active GATT connections (connect/disconnect)
  # - Service/characteristic/descriptor discovery
  # - GATT read/write operations
  # - Notification/indication subscriptions
  # - Pairing/bonding (future)
  # - Service caching in NVS flash

# ============================================================================
# BLE Scanner Control Switch
# ============================================================================
# System-wide switch to pause/resume BLE scanning
# Used to reduce API traffic during weather fetches and OTA updates
# See globals.yaml for usage documentation
# ============================================================================

switch:
  - platform: nimble_proxy
    nimble_proxy_id: nimble_proxy_component
    id: ble_scanner_switch
    name: "BLE Scanner"
    icon: mdi:bluetooth-audio
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"

# ============================================================================
# Startup Light Blink Animation
# ============================================================================
# Rainbow effect for 30 seconds on startup/WiFi disconnect
# ============================================================================

# Note: startup_light_blink switch is in packages/system/networking.yaml
# Note: Startup blink animation intervals are in system/networking.yaml (HA connection check)
# Note: RGB light component is in features/weather/weather_led_effects.yaml
# Note: cycleCounter global is in base/globals.yaml (load order dependency)
