# ============================================================================
# BLE Proxy + Improv - NimBLE Stack
# ============================================================================
# Purpose:
#   Home Assistant Bluetooth proxy and Improv WiFi provisioning on the NimBLE
#   stack instead of ESPHome's Bluedroid stack (ble_esphome.yaml).
#
# Features:
#   - bluetooth_proxy: ESPHome 2026.9.0's own proxy and connection code
#     (vendored in truffshuff/esphome-components), so Home Assistant sees the
#     same protocol behaviour as a Bluedroid proxy: raw advertisements, active
#     connections, GATT read/write/notify, pairing, cache clear, connection
#     params, scanner mode switching.
#   - nimble_tracker: the BLE scanner (esp32_ble_tracker equivalent). Merges
#     advertisement + scan response into one frame and does no duplicate
#     filtering, like Bluedroid. Upstream on-device BLE sensors that bind
#     through ble_device_base (ble_presence, ble_rssi, xiaomi_*, ...) work
#     against it.
#   - nimble_improv: Improv WiFi provisioning (esp32_improv equivalent). Runs
#     only while WiFi needs provisioning - no stored network, or no
#     connection for wifi_timeout - and stops once provisioned.
#   - ble_scanner_switch: pause/resume scanning (OTA, weather fetches).
#
# Dependencies:
#   - system/esphome_core.yaml (psram: component; PSRAM is required here)
#   - system/networking.yaml (WiFi; Improv provisions it)
#   - base/globals.yaml (cycleCounter used by the startup LED effects)
#
# Hardware requirements:
#   ESP32-S3 radio (BLE 5.0 controller); 8 MB PSRAM.
#
# Memory usage:
#   Flash: NimBLE is ~169 KB smaller than Bluedroid (ble_esphome.yaml).
#   PSRAM: NimBLE host allocations (nimble_base use_psram), the scan event
#     ring (64 x 44 B), and per connection slot a GATT event ring
#     (16 x ~530 B), four read buffers (~2 KB) and, only while a connection
#     is being discovered, a ~10 KB service table.
#   Internal SRAM: the NimBLE host task stack (8 KB, below) plus the
#     controller. Build-time, halo-v1-79e384 vs the previous fork (same
#     ESPHome 2026.9.0 / IDF 5.5.5): static DIRAM 219,531 -> 212,563 B
#     (-7.0 KB, of which .bss -6.4 KB: the old proxy's in-object event queue
#     moved to PSRAM); flash 2,371,291 -> 2,366,683 B (-4.6 KB).
#     Runtime min free internal heap is not measured yet (docs/MEMORY.md has
#     the previous fork's numbers).
#
# Alternative: ble_esphome.yaml (ESPHome's Bluedroid stack, no fork needed).
#
# Created: 2025 (NimBLE fork); rebuilt 2026-09-25 on the vendored upstream
# proxy.
# ============================================================================

# ============================================================================
# External components (truffshuff/esphome-components)
# ============================================================================
# ble_device_base, bluetooth_connection and bluetooth_proxy override ESPHome's
# built-in components of the same name with vendored 2026.9.0 copies that
# carry a small NimBLE patch set; nimble_base / nimble_tracker / nimble_improv
# provide the stack, scanner and provisioning. None of these are needed with
# ble_esphome.yaml. Hardware drivers stay in esphome_core.yaml.
# Pinned by full SHA (branch nimble-bluedroid-parity) so builds are
# reproducible.
# ============================================================================
external_components:
  - source: github://truffshuff/esphome-components@782d3bab90e83b23483e77b9b4f315c182fc4b73 # NimBLE backend for the upstream 2026.9.0 proxy
    components:
      - nimble_base
      - nimble_tracker
      - ble_device_base
      - bluetooth_connection
      - bluetooth_proxy
      - nimble_improv
    refresh: always

# ============================================================================
# NimBLE sdkconfig
# ============================================================================
# nimble_base now sets the stack selection (NimBLE on, Bluedroid off),
# CONFIG_BT_NIMBLE_MAX_CONNECTIONS (sized from the proxy slots + Improv's
# peripheral link; setting it lower here fails validation) and
# CONFIG_BT_NIMBLE_ATT_PREFERRED_MTU (517, what Bluedroid offers). It also
# requests the IDF `bt` component and WiFi/BT software coexistence - see
# docs/ARCHITECTURE.md section 7 for why coexistence is load-bearing.
# Only halo-specific tuning stays here.
# ============================================================================
esp32:
  framework:
    sdkconfig_options:
      # Bluedroid sub-components off so nothing Bluedroid-only compiles.
      CONFIG_BT_CLASSIC_ENABLED: "n"
      CONFIG_BT_SPP_ENABLED: "n"
      CONFIG_BT_HFP_ENABLE: "n"
      CONFIG_BT_A2DP_ENABLE: "n"
      CONFIG_BT_BLUFI_ENABLE: "n"
      CONFIG_BT_GATTS_ENABLE: "n"
      CONFIG_BT_GATTC_ENABLE: "n"

      CONFIG_BT_NIMBLE_ROLE_CENTRAL: "y"     # proxy connections
      CONFIG_BT_NIMBLE_ROLE_PERIPHERAL: "y"  # Improv provisioning
      CONFIG_BT_NIMBLE_HOST_TASK_STACK_SIZE: "8192"
      CONFIG_BT_RELEASE_IRAM_ON_SLEEP: "n"
      CONFIG_BT_NIMBLE_GATT_MAX_PROCS: "16"
      CONFIG_BT_NIMBLE_GATT_PREP_WRITE_COUNT: "16"
      CONFIG_BT_NIMBLE_MAX_CCCDS: "16"
      # A choice symbol: the int CONFIG_BT_NIMBLE_LOG_LEVEL is derived from it and
      # rejects a string ("INFO" was silently ignored before).
      CONFIG_BT_NIMBLE_LOG_LEVEL_INFO: "y"

# ============================================================================
# NimBLE stack
# ============================================================================
nimble_base:
  # Host allocations in PSRAM (CONFIG_BT_NIMBLE_MEM_ALLOC_MODE_EXTERNAL).
  use_psram: true

# ============================================================================
# Scanner
# ============================================================================
# Same timing as ble_esphome.yaml (320 ms / 60 ms, ~19% duty cycle) so the two
# packages compare like for like. The window drops to connection_scan_window
# while a proxy connection is up, as on Bluedroid.
# ============================================================================
nimble_tracker:
  id: ble_tracker
  scan_parameters:
    active: true
    interval: 320ms
    window: 60ms
    connection_scan_window: 30ms

# ============================================================================
# Home Assistant Bluetooth proxy
# ============================================================================
# connection_slots: 1 keeps the internal-heap budget halo has been running
# with (docs/MEMORY.md: each slot costs ~4 KB of min free heap on Bluedroid).
# ============================================================================
bluetooth_proxy:
  active: true
  connection_slots: 1

# ============================================================================
# Improv WiFi provisioning
# ============================================================================
# No authorizer: provisioning is accepted on connection. That is only
# reachable while WiFi is unprovisioned or has been down for wifi_timeout
# (the service does not run otherwise), which is esp32_improv's behaviour.
# ============================================================================
nimble_improv:
  authorized_duration: 2min
  wifi_timeout: 1min

# ============================================================================
# BLE Scanner Control Switch
# ============================================================================
# Pause/resume scanning around OTA updates and weather fetches (see
# base/globals.yaml). Same shape as ble_esphome.yaml's switch; the tracker
# starts scanning on boot by itself.
# ============================================================================
switch:
  - platform: template
    id: ble_scanner_switch
    name: "BLE Scanner"
    icon: mdi:bluetooth-audio
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: "config"
    optimistic: true
    on_turn_on:
      - nimble_tracker.start_scan:
          id: ble_tracker
          continuous: true
    on_turn_off:
      - nimble_tracker.stop_scan:
          id: ble_tracker

# Note: cycleCounter global is in base/globals.yaml (load order dependency).
# Startup blink animation lives in system/networking.yaml; the RGB light is in
# features/weather/weather_led_effects.yaml.
