# ============================================================================
# BLE Stub - no Bluetooth
# ============================================================================
# Purpose:
#   Lightweight placeholder for builds without Bluetooth. It defines
#   ble_scanner_switch, which the OTA hooks and the weather fetch scripts turn
#   off and on around their work, as a no-op template switch.
#
# Usage:
#   In your entry file's packages list, enable this file INSTEAD of
#   ble_improv.yaml or ble_esphome.yaml (exactly one of the three).
#
# Dependencies: None
# Hardware requirements: None
# Memory usage: none beyond the switch entity; removes the whole BLE stack
#   (NimBLE ~40 KB, mostly PSRAM; Bluedroid more, see docs/MEMORY.md).
# ============================================================================

switch:
  - platform: template
    name: "BLE Scanner (stub)"
    id: ble_scanner_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:bluetooth
    on_turn_on:
      - logger.log: "BLE stub: scanner turned ON (no-op)"
    on_turn_off:
      - logger.log: "BLE stub: scanner turned OFF (no-op)"

# Keep this package intentionally minimal. If you later need more
# stubbed IDs (other `ble_*` IDs referenced in your YAML), add them here
# as template switches/sensors so the rest of the system compiles and runs.
