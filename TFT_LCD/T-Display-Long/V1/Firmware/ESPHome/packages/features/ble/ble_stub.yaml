# BLE Stub Package
# Purpose: Lightweight placeholder to satisfy references to BLE-related IDs
# (e.g., `ble_scanner_switch`) when you intentionally omit the full
# BLE implementation (`ble_improv.yaml` or `ble_esphome.yaml`). This avoids
# compile-time errors from missing IDs while keeping behavior inert.

# Usage: In your `Halo-v1.yaml` packages list, replace the active BLE package
# with this file to disable Bluetooth proxy functionality entirely.

switch:
  - platform: template
    name: "BLE Scanner (stub)"
    id: ble_scanner_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    icon: mdi:bluetooth
    on_turn_on:
      - logger.log: "BLE stub: scanner turned ON (no-op)"
    on_turn_off:
      - logger.log: "BLE stub: scanner turned OFF (no-op)"

# Keep this package intentionally minimal. If you later need more
# stubbed IDs (other `ble_*` IDs referenced in your YAML), add them here
# as template switches/sensors so the rest of the system compiles and runs.
