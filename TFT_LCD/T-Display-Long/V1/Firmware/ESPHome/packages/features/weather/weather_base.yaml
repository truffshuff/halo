# ============================================================================
# Weather Base - Core Weather Infrastructure
# ============================================================================
#
# This module provides the core weather capability infrastructure including:
#   - Global weather data storage (current conditions, daily/hourly forecasts)
#   - Current-condition sensors subscribed from Home Assistant
#   - Forecast fetch scripts and their refresh intervals
#   - Weather page rotation switches and order numbers (all 4 weather page types)
#   - "Refresh Weather Data" button and the weather icon color script
#
# HOW FORECASTS ARRIVE:
#   Daily  - fetch_daily_forecast calls weather.get_forecasts with
#            homeassistant.action + capture_response over the native API.
#            REQUIRES the "Allow the device to perform Home Assistant
#            actions" option on this device in HA's ESPHome integration.
#   Hourly - pushed by HA: the hourly_forecast_attr text_sensor subscribes to
#            the `forecast` attribute of sensor.hourly_forecast_esp, a
#            trigger-based template sensor that must exist in Home Assistant
#            (README "Home Assistant setup"). fetch_hourly_forecast_http is
#            only a fallback for when that sensor is missing or stale: it is
#            synchronous and pulls the whole forecast (~57-63 KB).
#
# Dependencies:
#   - system/system_management.yaml (http_request, weather_helpers, time)
#   - system/display_hardware.yaml (for LVGL display)
#   - features/page_rotation/page_rotation.yaml (current_page_name)
#   - the selected BLE package (ble_scanner_switch, paused during fetches)
#   - features/weather/weather_page.yaml (update_weather_display,
#     lbl_weather_forecast_condition_icon), weather_daily.yaml
#     (update_daily_forecast_display) and weather_hourly.yaml
#     (update_hourly_page_1): this file calls their scripts, so those
#     packages are not independently optional today - see
#     docs/ARCHITECTURE.md "Known gaps" #2.
#
# Required Substitutions:
#   - weather_entity_id: Home Assistant weather entity (e.g., weather.hhut)
#   - current_temp_sensor, apparent_temp_sensor, wind_speed_sensor,
#     wind_direction_sensor: HA sensor entity ids for the current conditions
#   - ha_url: Home Assistant URL (HTTP fallback only; prefer HA's LAN IP)
#   - ha_token: Long-lived access token for Home Assistant (HTTP fallback only)
#   - weather_daily_refresh_interval: Daily forecast refresh interval in seconds (e.g., 3600)
#   - weather_hourly_refresh_interval: Hourly staleness check in seconds (e.g., 900)
#
# Notes:
#   - JSON pools are allocated in PSRAM (ArduinoJson Allocator, docs/MEMORY.md 5)
#   - Weather data is cached and only refreshed when stale
#
# MEMORY USAGE: ~8KB flash; forecast JSON parsing is transient PSRAM.
# ============================================================================

globals:
  # ============================================================================
  # Weather Data Storage Globals
  # ============================================================================

  # --- Lock and State Management ---
  - id: weather_fetch_lock
    type: bool
    initial_value: 'false'

  # --- Performance Tracking ---
  # Used to measure and log weather update operation timing
  - id: weather_last_started
    type: int
    restore_value: no
    initial_value: '0'
  - id: weather_last_duration
    type: int
    restore_value: no
    initial_value: '0'
  - id: weather_last_condition
    type: std::string
    restore_value: no
    initial_value: ""
  - id: weather_needs_render
    type: bool
    restore_value: no
    initial_value: 'false'

  # --- Current Weather State ---
  # Real-time weather conditions from Home Assistant
  - id: weather_current_temp
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: weather_current_apparent_temp
    type: float
    restore_value: no
    initial_value: 'NAN'
  - id: weather_current_condition
    type: std::string
    restore_value: no
    initial_value: '""'
  - id: weather_current_humidity
    type: float
    restore_value: no
    initial_value: 'NAN'

  # --- Daily Forecast Data (10 days) ---
  # Arrays store forecast data fetched from Home Assistant weather.get_forecasts API
  # Index 0 = today, Index 1 = tomorrow, etc.
  - id: weather_forecast_temp_high
    type: float[10]
    restore_value: no
  - id: weather_forecast_temp_low
    type: float[10]
    restore_value: no
  - id: weather_forecast_condition
    type: std::string[10]
    restore_value: no
  - id: weather_forecast_precip_prob
    type: float[10]
    restore_value: no
  - id: weather_forecast_datetime
    type: std::string[10]
    restore_value: no

  # --- Hourly Forecast Data (24 hours) ---
  # Arrays store hourly forecast from Home Assistant
  # Index 0 = current hour, Index 1 = next hour, etc.
  - id: weather_hourly_temp
    type: float[24]
    restore_value: no

  - id: weather_hourly_apparent_temp
    type: float[24]
    restore_value: no

  - id: weather_hourly_condition
    type: std::string[24]
    restore_value: no

  - id: weather_hourly_precip_prob
    type: float[24]
    restore_value: no

  - id: weather_hourly_datetime
    type: std::string[24]
    restore_value: no

  - id: weather_hourly_humidity
    type: float[24]
    restore_value: no

  - id: weather_hourly_precipitation
    type: float[24]
    restore_value: no

  - id: weather_hourly_pressure
    type: float[24]
    restore_value: no

  - id: weather_hourly_uv_index
    type: float[24]
    restore_value: no

  - id: weather_hourly_wind_speed
    type: float[24]
    restore_value: no

  - id: weather_hourly_wind_bearing
    type: float[24]
    restore_value: no

  # --- Timestamp Tracking ---
  - id: weather_last_update
    type: unsigned long
    restore_value: no
    initial_value: '0'

  # Separate tracking for daily vs hourly forecasts
  - id: weather_daily_last_update
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: weather_hourly_last_update
    type: unsigned long
    restore_value: no
    initial_value: '0'

  - id: weather_hourly_retry_count
    type: int
    restore_value: no
    initial_value: '0'

  - id: weather_on_weather_page
    type: bool
    restore_value: no
    initial_value: 'false'

  # ============================================================================
  # Weather Page Rotation Settings
  # ============================================================================
  # Weather feature includes 4 page types: Current, Daily Forecast, Hourly Forecast, Hourly Summary
  # Each can be independently enabled/disabled and ordered in rotation
  # ============================================================================

  # Weather page rotation enabled flags
  - id: page_rotation_weather_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: page_rotation_daily_forecast_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  - id: page_rotation_hourly_forecast_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'
  # Hourly summary page rotation flag (two pages: 1-12, 13-24)
  - id: page_rotation_hourly_summary_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'

  # Weather page rotation order (lower numbers show first). The HA number
  # entities below allow 1-10 and set these at boot from their restored values.
  - id: page_rotation_weather_order
    type: int
    restore_value: yes
    initial_value: '4'
  - id: page_rotation_daily_forecast_order
    type: int
    restore_value: yes
    initial_value: '5'
  - id: page_rotation_hourly_forecast_order
    type: int
    restore_value: yes
    initial_value: '6'
  - id: page_rotation_hourly_summary_order
    type: int
    restore_value: yes
    initial_value: '7'

# ============================================================================
# Page Rotation Switches
# ============================================================================

switch:
  # Page rotation selection switches
  - platform: template
    name: "Page Rotation: Weather Page"
    id: page_rotation_weather_switch
    icon: mdi:weather-partly-cloudy
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      - lambda: 'id(page_rotation_weather_enabled) = true;'
      - logger.log: "Weather page enabled in rotation"
      # Force immediate display update when page rotation is enabled
      - if:
          condition:
            lambda: 'return id(current_page_name) == "weather";'
          then:
            - script.execute: update_weather_icon_color
    on_turn_off:
      - lambda: 'id(page_rotation_weather_enabled) = false;'
      - logger.log: "Weather page disabled in rotation"

  - platform: template
    name: "Page Rotation: Daily Forecast Page"
    id: page_rotation_daily_forecast_switch
    icon: mdi:calendar-today
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      - lambda: 'id(page_rotation_daily_forecast_enabled) = true;'
      - logger.log: "Daily forecast page enabled in rotation"
      # Force immediate display update when page rotation is enabled
      - if:
          condition:
            lambda: 'return id(current_page_name) == "daily_forecast";'
          then:
            - script.execute: update_weather_icon_color
    on_turn_off:
      - lambda: 'id(page_rotation_daily_forecast_enabled) = false;'
      - logger.log: "Daily forecast page disabled in rotation"

  - platform: template
    name: "Page Rotation: Hourly Forecast Page"
    id: page_rotation_hourly_forecast_switch
    icon: mdi:clock-time-eight-outline
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      - lambda: 'id(page_rotation_hourly_forecast_enabled) = true;'
      - logger.log: "Hourly forecast page enabled in rotation"
      # Force immediate display update when page rotation is enabled
      - if:
          condition:
            lambda: 'return id(current_page_name) == "hourly_forecast";'
          then:
            - script.execute: update_weather_icon_color
    on_turn_off:
      - lambda: 'id(page_rotation_hourly_forecast_enabled) = false;'
      - logger.log: "Hourly forecast page disabled in rotation"

  - platform: template
    name: "Page Rotation: Hourly Summary Page"
    id: page_rotation_hourly_summary_switch
    icon: mdi:clock-fast
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      - lambda: 'id(page_rotation_hourly_summary_enabled) = true;'
      - logger.log: "Hourly summary page enabled in rotation"
      # Force immediate display update when page rotation is enabled
      - if:
          condition:
            lambda: 'return id(current_page_name) == "hourly_summary_1";'
          then:
            - script.execute: update_weather_icon_color
    on_turn_off:
      - lambda: 'id(page_rotation_hourly_summary_enabled) = false;'
      - logger.log: "Hourly summary page disabled in rotation"

# ============================================================================
# Page Order Numbers
# Named "Page Order: ..." like every other page since 2026-09-26 (previously
# "Page Rotation Order: ..."). The rename gave them new HA entities and reset
# their stored values to the initial_value defaults below.
# ============================================================================

number:
