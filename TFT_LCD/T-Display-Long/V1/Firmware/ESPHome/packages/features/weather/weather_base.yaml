  - platform: template
    name: "Page Order: Weather Page"
    id: page_rotation_weather_order_number
    icon: mdi:numeric
    entity_category: "config"
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    mode: box
    initial_value: 4
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(page_rotation_weather_order) = (int)x;
            ESP_LOGI("page_rotation", "Weather page order set to %d", (int)x);

  - platform: template
    name: "Page Order: Daily Forecast Page"
    id: page_rotation_daily_forecast_order_number
    icon: mdi:numeric
    entity_category: "config"
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    mode: box
    initial_value: 5
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(page_rotation_daily_forecast_order) = (int)x;
            ESP_LOGI("page_rotation", "Daily forecast page order set to %d", (int)x);

  - platform: template
    name: "Page Order: Hourly Forecast Page"
    id: page_rotation_hourly_forecast_order_number
    icon: mdi:numeric
    entity_category: "config"
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    mode: box
    initial_value: 6
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(page_rotation_hourly_forecast_order) = (int)x;
            ESP_LOGI("page_rotation", "Hourly forecast page order set to %d", (int)x);

  - platform: template
    name: "Page Order: Hourly Summary Page"
    id: page_rotation_hourly_summary_order_number
    icon: mdi:numeric
    entity_category: "config"
    optimistic: true
    min_value: 1
    max_value: 10
    step: 1
    mode: box
    initial_value: 7
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(page_rotation_hourly_summary_order) = (int)x;
            ESP_LOGI("page_rotation", "Hourly summary page order set to %d", (int)x);

  # Weather gauge number for LED effects
  - platform: template
    name: "Weather Gauge"
    id: weather_gauge
    icon: mdi:gauge
    entity_category: "diagnostic"
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    mode: box

# ============================================================================
# Weather Sensors from Home Assistant
# ============================================================================

sensor:
  # Current weather sensors from Home Assistant
  - platform: homeassistant
    id: current_temp_sensor
    entity_id: ${current_temp_sensor}
    on_value:
      then:
        - lambda: |-
            id(weather_current_temp) = x;

  - platform: homeassistant
    id: apparent_temp_sensor
    entity_id: ${apparent_temp_sensor}
    on_value:
      then:
        - lambda: |-
            id(weather_current_apparent_temp) = x;

  - platform: homeassistant
    id: current_humidity_sensor
    entity_id: ${weather_entity_id}
    attribute: humidity
    on_value:
      then:
        - lambda: |-
            id(weather_current_humidity) = x;

  # Wind speed sensor from Home Assistant
  - platform: homeassistant
    id: wind_speed_sensor
    entity_id: ${wind_speed_sensor}
    # No on_value trigger: this sensor's value is read directly with
    # id(wind_speed_sensor).state by the lambdas in weather_page.yaml.
    # Its only trigger used to set the dead `sensor_ui_dirty` flag, so the whole
    # block was removed in 2026.09 rather than left as an empty lambda.

  # Wind direction sensor from Home Assistant
  - platform: homeassistant
    id: wind_direction_sensor
    entity_id: ${wind_direction_sensor}
    # No on_value trigger: this sensor's value is read directly with
    # id(wind_direction_sensor).state by the lambdas in weather_page.yaml.
    # Its only trigger used to set the dead `sensor_ui_dirty` flag, so the whole
    # block was removed in 2026.09 rather than left as an empty lambda.

text_sensor:
  # Weather condition from Home Assistant
  - platform: homeassistant
    id: current_condition_sensor
    entity_id: ${weather_entity_id}
    on_value:
      then:
        - lambda: |-
            id(weather_current_condition) = x;
            // Normalize conditions onto the icon set (the same mapping is
            // repeated for the hourly and daily arrays below):
            // - POSSIBLY_RAINY_DAY/NIGHT: 'pouring' -> 'rainy' (low probability rain)
            // - POSSIBLY_SLEET_DAY/NIGHT + SLEET: 'hail' -> 'snowy-rainy' (mixed precipitation)
            // - THUNDERSTORM: 'lightning' -> 'lightning-rainy' (lightning with rain)
            // - WINDY: 'windy-variant' -> 'windy' (standard HA condition)
            // The weather_helpers fix this was waiting for has landed:
            // get_weather_icon() and get_weather_icon_color() now map all four
            // raw conditions themselves, so this normalization is redundant for
            // the icons. It still changes the condition text shown (e.g.
            // "Pouring" becomes "Rainy"), so remove it only deliberately.
            {
              std::string& cond = id(weather_current_condition);
              if (cond == "pouring") cond = "rainy";
              else if (cond == "hail") cond = "snowy-rainy";
              else if (cond == "lightning") cond = "lightning-rainy";
              else if (cond == "windy-variant") cond = "windy";
            }
            ESP_LOGI("weather", "Weather condition updated: %s", x.c_str());
            // Update weather icon color when condition changes
            if (id(current_page_name) == "weather") {
              id(update_weather_icon_color).execute();
            }

  # Hourly forecast attribute pulled from HA template sensor (JSON in `attributes.forecast`) 
  - platform: homeassistant
    id: hourly_forecast_attr
    entity_id: sensor.hourly_forecast_esp
    attribute: forecast
    on_value:
      then:
        - lambda: |-
            // Small guard and logging
            std::string s = x;
            ESP_LOGI("weather", "Received hourly forecast attribute (%d bytes)", s.length());

            // ----------------------------------------------------------------
            // PSRAM-backed JSON parse
            // ----------------------------------------------------------------
            // ArduinoJson 7 keeps its growing data pool in a separate
            // allocation reached through an Allocator; the JsonDocument object
            // itself is only ~32 bytes. The previous code heap_caps_malloc'd
            // sizeof(JsonDocument) in PSRAM and placement-new'd into it, which
            // placed those 32 bytes in PSRAM and left the POOL - the part that
            // actually grows to tens of KB - on the default allocator. It only
            // stayed out of internal DRAM because
            // CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL is set to 512.
            //
            // Supplying an allocator puts the pool in PSRAM explicitly, and the
            // document can then live on the stack with normal RAII - no manual
            // destructor call and no leak path on early return.
            struct PsramJsonAllocator : ArduinoJson::Allocator {
              void *allocate(size_t size) override {
                return heap_caps_malloc(size, MALLOC_CAP_SPIRAM);
              }
              void deallocate(void *ptr) override { heap_caps_free(ptr); }
              void *reallocate(void *ptr, size_t new_size) override {
                return heap_caps_realloc(ptr, new_size, MALLOC_CAP_SPIRAM);
              }
            };
            static PsramJsonAllocator psram_json_alloc;
            JsonDocument doc(&psram_json_alloc);
            App.feed_wdt();
            DeserializationError err = deserializeJson(doc, s);
            if (err) {
              ESP_LOGE("weather", "Hourly attribute JSON parse failed: %s", err.c_str());
              return;
            }

            JsonArray forecast_array = doc.as<JsonArray>();
            int count = std::min((int)forecast_array.size(), 24);
            ESP_LOGI("weather", "Parsing %d hourly entries from attribute", count);

            int idx = 0;
            for (JsonObject hour : forecast_array) {
              if (idx >= 24) break;

              if (hour["temperature"].is<float>())
                id(weather_hourly_temp)[idx] = hour["temperature"].as<float>();
              if (hour["apparent_temperature"].is<float>())
                id(weather_hourly_apparent_temp)[idx] = hour["apparent_temperature"].as<float>();
              if (hour["condition"].is<const char*>()) {
                id(weather_hourly_condition)[idx] = hour["condition"].as<std::string>();
                // Normalize conditions (see the current-condition sensor above)
                std::string& cond = id(weather_hourly_condition)[idx];
                if (cond == "pouring") cond = "rainy";
                else if (cond == "hail") cond = "snowy-rainy";
                else if (cond == "lightning") cond = "lightning-rainy";
                else if (cond == "windy-variant") cond = "windy";
              }
              if (hour["precipitation_probability"].is<float>())
                id(weather_hourly_precip_prob)[idx] = hour["precipitation_probability"].as<float>();
              if (hour["datetime"].is<const char*>())
                id(weather_hourly_datetime)[idx] = hour["datetime"].as<std::string>();

              // Additional fields
              if (hour["humidity"].is<float>())
                id(weather_hourly_humidity)[idx] = hour["humidity"].as<float>();
              if (hour["precipitation"].is<float>())
                id(weather_hourly_precipitation)[idx] = hour["precipitation"].as<float>();
              if (hour["pressure"].is<float>())
                id(weather_hourly_pressure)[idx] = hour["pressure"].as<float>();
              if (hour["uv_index"].is<float>())
                id(weather_hourly_uv_index)[idx] = hour["uv_index"].as<float>();
              if (hour["wind_speed"].is<float>())
                id(weather_hourly_wind_speed)[idx] = hour["wind_speed"].as<float>();
              if (hour["wind_bearing"].is<float>())
                id(weather_hourly_wind_bearing)[idx] = hour["wind_bearing"].as<float>();

              idx++;
              if (idx % 6 == 0) App.feed_wdt();
            }

            id(weather_hourly_last_update) = millis();
            id(weather_last_update) = millis();
            ESP_LOGI("weather", "✓ Hourly forecast stored successfully (from attribute)");

            // If on hourly page, trigger update
            if (id(current_page_name) == "hourly_forecast") {
              id(update_hourly_page_1).execute();
            }

# ============================================================================
# Weather Refresh Intervals
# ============================================================================

interval:
  # Auto-refresh DAILY forecast periodically (independent of which page is displayed)
  # Runs every weather_daily_refresh_interval and refreshes if the data is
  # older than that interval (pages also fetch on load when stale).
  - interval: ${weather_daily_refresh_interval}s
    then:
      - if:
          condition:
            lambda: |-
                // Check if fetch is already in progress
                if (id(weather_fetch_lock)) {
                ESP_LOGW("weather", "Daily forecast fetch already in progress, skipping");
                return false;
                }

                // Calculate time since last daily forecast update
                unsigned long current_time = millis();
                unsigned long time_since_last_update = (current_time - id(weather_daily_last_update)) / 1000;

                // Only fetch if data is stale (older than refresh interval)
                if (time_since_last_update > ${weather_daily_refresh_interval}) {
                ESP_LOGI("weather", "Background daily forecast refresh triggered (data age: %lu minutes)",
                        time_since_last_update / 60);
                return true;
                }
                return false;
          then:
            - lambda: 'id(weather_fetch_lock) = true;'
            - script.execute: fetch_daily_forecast

  # Auto-refresh HOURLY forecast periodically (independent of which page is displayed)
  # Runs every weather_hourly_refresh_interval. HA normally keeps the data
  # fresh by pushing sensor.hourly_forecast_esp (hourly_forecast_attr above,
  # which updates weather_hourly_last_update), so this only fires the HTTP
  # fallback when that push has gone stale.
  - interval: ${weather_hourly_refresh_interval}s
    then:
      - if:
          condition:
            lambda: |-
                // Check if fetch is already in progress
                if (id(weather_fetch_lock)) {
                ESP_LOGW("weather", "Hourly forecast fetch already in progress, skipping");
                return false;
                }

                // Skip if API not connected - no point attempting HTTP if HA is unreachable
                if (!api::global_api_server->is_connected()) {
                ESP_LOGW("weather", "Hourly interval fetch skipped: API not connected");
                return false;
                }

                // Calculate time since last hourly forecast update
                unsigned long current_time = millis();
                unsigned long time_since_last_update = (current_time - id(weather_hourly_last_update)) / 1000;

                // Only fetch if data is stale (older than refresh interval)
                if (time_since_last_update > ${weather_hourly_refresh_interval}) {
                ESP_LOGI("weather", "Background hourly forecast refresh triggered (data age: %lu minutes)",
                        time_since_last_update / 60);
                return true;
                }
                return false;
          then:
            - lambda: 'id(weather_fetch_lock) = true; id(weather_hourly_retry_count) = 0;'
            - script.execute: fetch_hourly_forecast

# ============================================================================
# Weather Scripts
# ============================================================================

script:
  # ============================================================================
  # Weather Icon Color Update Script
  # ============================================================================
  - id: update_weather_icon_color
    mode: restart
    then:
      - lambda: |-
          id(weather_last_started) = millis();
          id(weather_needs_render) = false;
      - lambda: |-
          std::string condition = id(weather_current_condition);
          ESP_LOGD("weather_color", "Current condition: '%s'", condition.c_str());
          if (condition.empty()) {
          return;
          }
          std::string normalized = condition;
          std::transform(normalized.begin(), normalized.end(), normalized.begin(), ::tolower);
          if (normalized != id(weather_last_condition)) {
          id(weather_last_condition) = normalized;
          id(weather_needs_render) = true;
          }
      - if:
          condition:
            lambda: 'return id(weather_needs_render);'
          then:
            - lvgl.label.update:
                id: lbl_weather_forecast_condition_icon
                text: !lambda |-
                  using namespace weather_helpers;
                  return get_weather_icon(id(weather_last_condition));
                text_color: !lambda |-
                  using namespace weather_helpers;
                  ESP_LOGD("weather_color", "Applying color for condition: '%s'", id(weather_last_condition).c_str());
                  return lv_color_hex(get_weather_icon_color(id(weather_last_condition)));
      - lambda: |-
          const uint32_t elapsed = millis() - id(weather_last_started);
          id(weather_last_duration) = elapsed;
          const bool rendered = id(weather_needs_render);
          if (elapsed > 80) {
          ESP_LOGW("weather_color", "update_weather_icon_color took %lu ms (rendered=%s)", elapsed, rendered ? "true" : "false");
          } else {
          ESP_LOGD("weather_color", "update_weather_icon_color took %lu ms (rendered=%s)", elapsed, rendered ? "true" : "false");
          }
          id(weather_needs_render) = false;

  # ============================================================================
  # DAILY forecast: native weather.get_forecasts action (the production path)
  # ============================================================================
  # homeassistant.action with capture_response over the API. It began as a
  # test on ESPHome 2025.11.2 and replaced the HTTP daily fetch. The daily
  # payload is small (10 entries), so the 65,535-byte API message limit that
  # rules this out for the full hourly forecast does not apply.
  # Needs "Allow the device to perform Home Assistant actions" enabled for
  # this device in HA; without it on_error fires.
  # ============================================================================

  # Script to fetch DAILY forecast data via native HA action
  - id: fetch_daily_forecast
    mode: single
    then:
      - lambda: |-
          // Ensure lock is set
          id(weather_fetch_lock) = true;

      # Pause BLE scanner during network fetch to reduce WiFi/BLE coexistence
      # interference and CPU contention during JSON processing.
      - switch.turn_off: ble_scanner_switch

      - logger.log:
          format: "→ Fetching daily forecast using native weather.get_forecasts action..."
          level: INFO

      # Feed watchdog before long operation
      - lambda: |-
          App.feed_wdt();
          ESP_LOGI("weather", "Free heap before daily fetch: %lu bytes", esp_get_free_heap_size());
          ESP_LOGI("weather", "About to call homeassistant.action: weather.get_forecasts");

      # Fetch daily forecast using native action
      - homeassistant.action:
          action: weather.get_forecasts
          data:
            entity_id: ${weather_entity_id}
            type: daily
          capture_response: true
          on_success:
            then:
              - lambda: |-
                  // Feed watchdog at start of processing
                  App.feed_wdt();

                  ESP_LOGI("weather", "✓ Daily forecast response received via native action");
                  ESP_LOGI("weather", "Free heap at daily response: %lu bytes", esp_get_free_heap_size());

                  // Log memory state before JSON parsing
                  ESP_LOGI("memory", "Before JSON parse - Internal RAM free: %d, PSRAM free: %d",
                         heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                         heap_caps_get_free_size(MALLOC_CAP_SPIRAM));

                  // response is provided by ESPHome as JsonObjectConst
                  // The response format from homeassistant.action is simpler than HTTP REST API
                  // It returns: {"forecast": [...]} directly, NOT wrapped in entity_id

                  ESP_LOGI("weather", "DEBUG: Checking response structure...");

                  // Debug: Print what keys are in the response
                  ESP_LOGI("weather", "DEBUG: Response keys:");
                  for (JsonPairConst kv : response) {
                    ESP_LOGI("weather", "  Key: '%s'", kv.key().c_str());
                  }

                  // Native action returns: {"weather.hhut": {"forecast": [...]}}
                  // This is simpler than HTTP REST API which returns:
                  // {"service_response": {"weather.hhut": {"forecast": [...]}}}

                  const char *entity_key = "${weather_entity_id}";

                  JsonArrayConst forecast_array;
                  bool found_forecast = false;

                  // Try format 1: {"response": {"weather.hhut": {"forecast": [...]}}}
                  if (response["response"].is<JsonObjectConst>()) {
                    JsonObjectConst response_data = response["response"];
                    ESP_LOGI("weather", "DEBUG: Found 'response' wrapper object");

                    if (response_data[entity_key].is<JsonObjectConst>()) {
                      ESP_LOGI("weather", "DEBUG: Found entity '%s' inside response wrapper", entity_key);
                      JsonObjectConst entity_data = response_data[entity_key];

                      if (entity_data["forecast"].is<JsonArrayConst>()) {
                        forecast_array = entity_data["forecast"];
                        found_forecast = true;
                        ESP_LOGI("weather", "DEBUG: Using forecast from response['%s']['forecast']", entity_key);
                      }
                    }
                  }

                  // Try format 2: {"weather.hhut": {"forecast": [...]}}
                  if (!found_forecast && response[entity_key].is<JsonObjectConst>()) {
                    ESP_LOGI("weather", "DEBUG: Found entity '%s' at top level (native action format)", entity_key);
                    JsonObjectConst entity_data = response[entity_key];

                    if (entity_data["forecast"].is<JsonArrayConst>()) {
                      forecast_array = entity_data["forecast"];
                      found_forecast = true;
                      ESP_LOGI("weather", "DEBUG: Using forecast from entity_data['forecast']");
                    }
                  }

                  // Try format 3: {"forecast": [...]} (direct format)
                  if (!found_forecast && response["forecast"].is<JsonArrayConst>()) {
                    forecast_array = response["forecast"];
                    found_forecast = true;
                    ESP_LOGI("weather", "DEBUG: Using forecast from response['forecast'] (direct format)");
                  }

                  if (!found_forecast) {
                    ESP_LOGE("weather", "No forecast array found in response");
                    return;
                  }

                  if (true) {  // Keep existing block structure
                    int day_count = std::min((int)forecast_array.size(), 10);
                    ESP_LOGI("weather", "Found %d days of forecast data", day_count);

                    // Feed watchdog before processing loop
                    App.feed_wdt();

                    int idx = 0;
                    for (JsonObjectConst day : forecast_array) {
                      if (idx >= 10) break;

                      // Feed watchdog every 3 days
                      if (idx > 0 && idx % 3 == 0) {
                        App.feed_wdt();
                      }

                      if (day["temperature"].is<float>()) {
                        id(weather_forecast_temp_high)[idx] = day["temperature"].as<float>();
                      }

                      if (day["templow"].is<float>()) {
                        id(weather_forecast_temp_low)[idx] = day["templow"].as<float>();
                      }

                      if (day["condition"].is<const char*>()) {
                        id(weather_forecast_condition)[idx] = day["condition"].as<std::string>();
                        // Normalize conditions (see the current-condition sensor above)
                        std::string& cond = id(weather_forecast_condition)[idx];
                        if (cond == "pouring") cond = "rainy";
                        else if (cond == "hail") cond = "snowy-rainy";
                        else if (cond == "lightning") cond = "lightning-rainy";
                        else if (cond == "windy-variant") cond = "windy";
                      }

                      if (day["precipitation_probability"].is<float>()) {
                        id(weather_forecast_precip_prob)[idx] = day["precipitation_probability"].as<float>();
                      }

                      if (day["datetime"].is<const char*>()) {
                        id(weather_forecast_datetime)[idx] = day["datetime"].as<std::string>();
                      }

                      // Extract "current" weather from today's forecast (day 0)
                      if (idx == 0) {
                        if (day["condition"].is<const char*>()) {
                          id(weather_current_condition) = day["condition"].as<std::string>();
                          // Normalize conditions (see the current-condition sensor above)
                          std::string& cond = id(weather_current_condition);
                          if (cond == "pouring") cond = "rainy";
                          else if (cond == "hail") cond = "snowy-rainy";
                          else if (cond == "lightning") cond = "lightning-rainy";
                          else if (cond == "windy-variant") cond = "windy";
                          ESP_LOGI("weather", "Current condition from forecast: %s", id(weather_current_condition).c_str());
                        }
                      }
                      idx++;
                    }
                    ESP_LOGI("weather", "✓ Daily forecast stored successfully");

                    ESP_LOGI("weather", "Free heap after parse - Internal: %d, PSRAM: %d",
                           heap_caps_get_free_size(MALLOC_CAP_INTERNAL),
                           heap_caps_get_free_size(MALLOC_CAP_SPIRAM));

                    // Update daily forecast timestamp
                    id(weather_daily_last_update) = millis();
                    id(weather_last_update) = millis();
                  }

              # Small delay to allow memory cleanup
              - delay: 100ms

              # Update display after fetching
              - script.execute: update_weather_display
              - delay: 50ms
              - script.execute: update_weather_icon_color
              - delay: 50ms
              - script.execute: update_daily_forecast_display
          on_error:
            then:
              - lambda: |-
                  ESP_LOGE("weather", "✗ Daily forecast fetch FAILED via native action");
                  ESP_LOGE("weather", "This likely means homeassistant.action with capture_response is not working");
                  ESP_LOGE("weather", "You may need to revert to HTTP-based fetch");
              - logger.log:
                  format: "ERROR: Native action failed - see logs above"
                  level: ERROR

      # Resume BLE scanner after fetch completes (success or failure)
      - switch.turn_on: ble_scanner_switch

      - lambda: |-
          // Always clear the lock when done
          id(weather_fetch_lock) = false;

  # The old HTTP-based daily fetch (fetch_daily_forecast_http) was removed in
  # 2026.09 - it had been commented out since the native action above became
  # the daily path. It is in git history (weather_base.yaml at commit
  # 6d0a13e4 or earlier) if a rollback is ever needed; note it used the
  # placement-new JsonDocument pattern that docs/MEMORY.md section 5 retires.

  # FALLBACK ONLY - fetch HOURLY forecast over HTTP REST.
  #
  # The primary path is the `hourly_forecast_attr` text_sensor above, which
  # receives a pre-trimmed 24-entry forecast pushed over the API connection.
  #
  # An older comment here read "Native homeassistant.action always fails; go
  # straight to HTTP." The action was not broken - the payload was too big.
  # weather.get_forecasts for weather.hhut returns ~220 hourly entries
  # (63,204 bytes measured 2026-09-21), and ESPHome's API carries 16-bit frame
  # lengths, so a single message cannot exceed 65,535 bytes. The full payload
  # sat ~2.3 KB under that ceiling: it would fail the moment the provider
  # extended its horizon, and it left no room for protocol overhead.
  #
  # Fixed in Home Assistant, not here: config/templates/halo_hourly_forecast.yaml
  # publishes the first 24 entries (~6.2 KB) on sensor.hourly_forecast_esp.
  # That HA file is not in this repository; the README's "Home Assistant
  # setup" section has an equivalent template.
  # Verified on device 2026-09-21: "Received hourly forecast attribute
  # (6225 bytes)" -> "Parsing 24 hourly entries" -> stored, with no HTTP
  # fallback triggered.
  #
  # This HTTP route stays as a genuine fallback for when that entity is absent.
  # Remember it is SYNCHRONOUS: a 57 KB pull blocked the main loop ~12s and
  # could trip the 30s task watchdog.
  - id: fetch_hourly_forecast
    mode: single
    then:
      - script.execute: fetch_hourly_forecast_http

  # HTTP script for hourly forecasts
  - id: fetch_hourly_forecast_http
    mode: single
    then:
      - lambda: |-
          id(weather_fetch_lock) = true;
          id(weather_hourly_retry_count) = 0;
          ESP_LOGI("weather", "=== HOURLY FORECAST FETCH (HTTP fallback) START ===");

      # Pause BLE scanner during HTTP POST to reduce WiFi/BLE coexistence
      # interference and free CPU for JSON parsing.
      - switch.turn_off: ble_scanner_switch

      - lambda: |-
          App.feed_wdt();
          ESP_LOGI("weather", "Free heap before hourly HTTP: %lu bytes (internal: %zu)",
                   esp_get_free_heap_size(), heap_caps_get_free_size(MALLOC_CAP_INTERNAL));
          ESP_LOGI("weather", "Hourly HTTP target: %s/api/services/weather/get_forecasts",
                   "${ha_url}");

      - http_request.post:
          url: "${ha_url}/api/services/weather/get_forecasts?return_response=true"
          request_headers:
            Content-Type: application/json
            Authorization: !lambda |-
              return "Bearer ${ha_token}";
          body: !lambda |-
            return "{\"entity_id\":\"${weather_entity_id}\",\"type\":\"hourly\"}";
          on_response:
            then:
              - lambda: |-
                  App.feed_wdt();
                  ESP_LOGI("weather", "HTTP fallback status: %d", response->status_code);

                  if (response->status_code != 200) {
                    ESP_LOGE("weather", "✗ HTTP fallback request failed with status %d", response->status_code);
                    return;
                  }

                  // Read response body
                  std::string body;
                  body.reserve(32768);  // Reserve 32KB for response (hourly may be large)
                  uint8_t buf[512];
                  while (response->get_bytes_read() < response->content_length) {
                    int len = response->read(buf, sizeof(buf));
                    if (len > 0) {
                      body.append((char*)buf, len);
                      if (body.length() % 4096 == 0) App.feed_wdt();
                    }
                  }

                  ESP_LOGI("weather", "✓ Fallback received %d bytes", body.length());

                  // ----------------------------------------------------------------
                  // PSRAM-backed JSON parse
                  // ----------------------------------------------------------------
                  // ArduinoJson 7 keeps its growing data pool in a separate
                  // allocation reached through an Allocator; the JsonDocument object
                  // itself is only ~32 bytes. The previous code heap_caps_malloc'd
                  // sizeof(JsonDocument) in PSRAM and placement-new'd into it, which
                  // placed those 32 bytes in PSRAM and left the POOL - the part that
                  // actually grows to tens of KB - on the default allocator. It only
                  // stayed out of internal DRAM because
                  // CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL is set to 512.
                  //
                  // Supplying an allocator puts the pool in PSRAM explicitly, and the
                  // document can then live on the stack with normal RAII - no manual
                  // destructor call and no leak path on early return.
                  struct PsramJsonAllocator : ArduinoJson::Allocator {
                    void *allocate(size_t size) override {
                      return heap_caps_malloc(size, MALLOC_CAP_SPIRAM);
                    }
                    void deallocate(void *ptr) override { heap_caps_free(ptr); }
                    void *reallocate(void *ptr, size_t new_size) override {
                      return heap_caps_realloc(ptr, new_size, MALLOC_CAP_SPIRAM);
                    }
                  };
                  static PsramJsonAllocator psram_json_alloc;
                  JsonDocument doc(&psram_json_alloc);

                  App.feed_wdt();
                  DeserializationError err = deserializeJson(doc, body);
                  if (err) {
                    ESP_LOGE("weather", "Fallback JSON parse failed: %s", err.c_str());
                    return;
                  }

                  // HTTP REST API returns: {"service_response": {"weather.hhut": {"forecast": [...]}}}
                  JsonArrayConst forecast_array;
                  if (doc["service_response"]["${weather_entity_id}"]["forecast"].is<JsonArrayConst>()) {
                    forecast_array = doc["service_response"]["${weather_entity_id}"]["forecast"];
                  } else {
                    ESP_LOGE("weather", "Fallback: No forecast array found in response");
                    return;
                  }

                  int count = std::min((int)forecast_array.size(), 24);
                  ESP_LOGI("weather", "Fallback processing %d hours...", count);

                  int idx = 0;
                  for (JsonObjectConst hour : forecast_array) {
                    if (idx >= 24) break;

                    if (hour["temperature"].is<float>())
                      id(weather_hourly_temp)[idx] = hour["temperature"].as<float>();
                    if (hour["apparent_temperature"].is<float>())
                      id(weather_hourly_apparent_temp)[idx] = hour["apparent_temperature"].as<float>();
                    if (hour["condition"].is<const char*>())
                      id(weather_hourly_condition)[idx] = hour["condition"].as<std::string>();
                    if (hour["precipitation_probability"].is<float>())
                      id(weather_hourly_precip_prob)[idx] = hour["precipitation_probability"].as<float>();
                    if (hour["datetime"].is<const char*>())
                      id(weather_hourly_datetime)[idx] = hour["datetime"].as<std::string>();

                    // Additional fields
                    if (hour["humidity"].is<float>())
                      id(weather_hourly_humidity)[idx] = hour["humidity"].as<float>();
                    if (hour["precipitation"].is<float>())
                      id(weather_hourly_precipitation)[idx] = hour["precipitation"].as<float>();
                    if (hour["pressure"].is<float>())
                      id(weather_hourly_pressure)[idx] = hour["pressure"].as<float>();
                    if (hour["uv_index"].is<float>())
                      id(weather_hourly_uv_index)[idx] = hour["uv_index"].as<float>();
                    if (hour["wind_speed"].is<float>())
                      id(weather_hourly_wind_speed)[idx] = hour["wind_speed"].as<float>();
                    if (hour["wind_bearing"].is<float>())
                      id(weather_hourly_wind_bearing)[idx] = hour["wind_bearing"].as<float>();

                    idx++;
                    if (idx % 6 == 0) App.feed_wdt();
                  }

                  id(weather_hourly_last_update) = millis();
                  id(weather_last_update) = millis();
                  ESP_LOGI("weather", "✓ Hourly forecast stored successfully (HTTP fallback)");

              - delay: 100ms
              - if:
                  condition:
                    lambda: 'return id(current_page_name) == "hourly_forecast";'
                  then:
                    - script.execute: update_hourly_page_1
          on_error:
            then:
              - lambda: |-
                  ESP_LOGE("weather", "✗ Hourly HTTP request failed (will retry at next interval)");

      # Resume BLE scanner after HTTP fetch completes
      - switch.turn_on: ble_scanner_switch

      - lambda: |-
          id(weather_fetch_lock) = false;
          ESP_LOGI("weather", "=== HOURLY FORECAST FETCH (HTTP fallback) END ===");

  # Transitional helper script that triggers both forecast fetches.
  # Retained for compatibility with existing automation; prefer calling
  # fetch_daily_forecast and fetch_hourly_forecast directly when practical.
  - id: fetch_weather_data
    mode: single
    then:
      - logger.log: "Fetching both daily and hourly forecasts..."
      - script.execute: fetch_daily_forecast
      - script.wait: fetch_daily_forecast
      - delay: 500ms  # Brief pause between fetches
      - script.execute: fetch_hourly_forecast

# ============================================================================
# Weather Navigation Buttons
# ============================================================================

button:
  # Weather refresh button
  - platform: template
    name: "Refresh Weather Data"
    id: weather_refresh_button
    icon: mdi:refresh
    on_press:
      - script.execute: fetch_weather_data
