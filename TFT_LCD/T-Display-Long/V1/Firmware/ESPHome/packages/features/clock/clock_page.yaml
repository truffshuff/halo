# ============================================================================
# Clock Page Module
# ============================================================================
# Vertical clock display with large time and date
#
# Dependencies:
#   - features/clock/clock_base.yaml (time_update script, time_update_force_render,
#     vclock_colon_motion script, colon_blink_enabled switch)
#   - features/page_rotation/page_rotation.yaml (current_page_name,
#     last_auto_rotation_time)
#   - system/fonts_colors.yaml (montserrat_80/50/24, my_white, my_gray)
#
# Features:
#   - Large vertical time display (hours, colon, minutes)
#   - Breathing colon: an LVGL animation (vclock_colon_breathe, below) that
#     fades the colon's opacity; runs only while this page is showing
#
# MEMORY: one LvAnimation component, ~200 B static internal SRAM. Measured
# 2026-10-25 for all four animations together (clock, AirQ, weather x2) on
# halo-v1-79e384.yaml: +808 B static internal SRAM, +4.3 KB flash. It redraws
# only the colon glyph (montserrat_80, ~30x80 px)
#   - AM/PM indicator (12-hour) or 24-hour format
#   - Current date display
#   - Day of week display
#   - Navigation touch button
# ============================================================================

# ============================================================================
# LVGL Pages - Clock Display
# ============================================================================
lvgl:
  # --------------------------------------------------------------------------
  # Breathing colon (ESPHome LVGL animation). One cycle fades the colon to 15 %
  # and back over 2 s, matching the old 1 s on / 1 s off blink. Started and
  # stopped by vclock_colon_motion (clock_base.yaml); a stopped animation
  # leaves the colon mid-fade, so that script resets it to opaque.
  # --------------------------------------------------------------------------
  animations:
    - id: vclock_colon_breathe
      duration: 2s
      loop: true
      timing:
        - round_trip
        - ease_in_out
      widgets:
        - id: vclock_colon
          opa:
            from: 100%
            to: 15%

  pages:
    # ------------------------------------------------------------------------
    # Vertical Clock Page
    # ------------------------------------------------------------------------
    # Large vertical time display with breathing colon
    # Shows: Hours | Colon | Minutes | AM/PM | Date | Day
    # Auto-updates every second via time_update script
    # ------------------------------------------------------------------------
    - id: vertical_clock_page
      bg_color: 0x000000
      bg_opa: COVER
      scrollbar_mode: "OFF"
      on_load:
        - lambda: |-
            id(current_page_name) = "vertical_clock";
            id(time_update_force_render) = true;
        - script.execute: time_update
        - script.execute: vclock_colon_motion
      on_unload:
        # Stopped directly, not through vclock_colon_motion: current_page_name
        # may still read "vertical_clock" here, which would restart it.
        - lvgl.animation.stop: vclock_colon_breathe
        - lvgl.widget.update:
            id: vclock_colon
            opa: COVER
      widgets:
        # Large time display vertically centered
        - label:
            id: vclock_hours
            align: CENTER
            text_font: montserrat_80
            text_color: my_white
            x: 0
            y: -120
            text: "12"

        - label:
            id: vclock_colon
            align: CENTER
            text_font: montserrat_80
            text_color: my_white
            x: 0
            y: -20
            text: ":"

        - label:
            id: vclock_minutes
            align: CENTER
            text_font: montserrat_80
            text_color: my_white
            x: 0
            y: 80
            text: "00"

        - label:
            id: vclock_ampm
            align: CENTER
            text_font: montserrat_50
            text_color: my_white
            x: 0
            y: 180
            text: "AM"

        # Date below time
        - label:
            id: vclock_date
            align: CENTER
            text_font: montserrat_24
            text_color: my_gray
            x: 0
            y: 250
            text: "Mon, Jan 1"

        # Day of week at top
        - label:
            id: vclock_day_top
            align: TOP_MID
            text_font: montserrat_24
            text_color: my_gray
            x: 0
            y: 20
            text: "Monday"

        # Navigation button (top right corner)
        - obj:
            id: nav_button_vclock
            align: TOP_RIGHT
            x: 0
            y: 0
            width: 180
            height: 150
            bg_opa: 0
            border_width: 0
            clickable: true
            on_release:
              - logger.log: "Vertical Clock page nav button RELEASED!"
              - lambda: |-
                  ESP_LOGI("touch", "Navigation button touched");
                  id(last_auto_rotation_time) = millis();
                  ESP_LOGD("touch", "Auto-rotation timer reset");
              - lvgl.page.next:
                  animation: OUT_LEFT
                  time: 300ms
