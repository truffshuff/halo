# ============================================================================
# Page Rotation Capability Module
# ============================================================================
# Provides master controls for automatic page rotation functionality
#
# FEATURES:
#   - Master auto-rotation enable/disable switch
#   - Rotation interval configuration (5-300 seconds)
#   - Core rotation globals (enabled state, interval, timing)
#   - Current page tracking
#   - Touch event integration (resets rotation timer)
#
# ARCHITECTURE NOTE:
#   This module owns current_page_name, the rotation interval, the "Default
#   Page at Boot" select and page_transition_cleanup. Per-page enable
#   switches and order numbers are spread out:
#   - Clock: features/clock/clock_base.yaml
#   - AirQ: HERE (the switch and order number); the globals are in
#     features/airq/airq_base.yaml
#   - WiFi: features/wifi_status/wifi_page_base.yaml
#   - Weather (4 page types): features/weather/weather_base.yaml
#   - Printer: features/printer/printer_base.yaml
#   The "Auto Page Rotation" master switch is in
#   features/diagnostics/diagnostics.yaml, so a build without diagnostics
#   has no HA toggle for it (rotation still runs; the global defaults on).
#
#   The rotation logic itself (1 s decision + 100 ms page-show dispatch) is
#   in Halo-v1-Core.yaml because it orchestrates across all pages.
#
# HARDWARE REQUIRED:
#   - Display with LVGL (for page switching)
#   - Touchscreen (optional, for touch-to-reset-timer)
#
# DEPENDENCIES:
#   - system/esphome_core.yaml (ESP32 config)
#   - system/display_hardware.yaml (Display, touchscreen)
#   - features/airq/airq_base.yaml (page_rotation_AirQ_* globals)
#   - features/clock/clock_base.yaml (time_update, time_update_last_text)
#   - features/weather/weather_base.yaml (weather_last_condition, cleared by
#     page_transition_cleanup)
#
# MEMORY USAGE: ~1KB flash
#
# Created: 2025-11-14 (module extraction)
# ============================================================================

# ============================================================================
# Globals (Master Page Rotation Controls)
# ============================================================================
globals:
  # Current page tracking using string name
  # Possible values: "vertical_clock", "airq", "wifi", "weather",
  #                  "hourly_forecast", "hourly_summary_1", "hourly_summary_2",
  #                  "daily_forecast", "printer"
  # Writing a new value makes Halo-v1-Core.yaml's 100 ms interval show that page.
  - id: current_page_name
    type: std::string
    restore_value: no
    initial_value: '"vertical_clock"'

  # Auto page rotation master enable/disable
  # When true, device automatically cycles through enabled pages
  # Controllable via Home Assistant switch
  - id: auto_page_rotation_enabled
    type: bool
    restore_value: yes
    initial_value: 'true'

  # Auto page rotation interval (seconds)
  # How long to display each page before rotating to next
  # Default: 30 seconds. Adjustable via Home Assistant
  - id: auto_page_rotation_interval
    type: int
    restore_value: yes
    initial_value: '30'

  # Last auto-rotation timestamp
  # Tracks when last page rotation occurred (in milliseconds)
  # Used to calculate when next rotation should happen
  - id: last_auto_rotation_time
    type: unsigned long
    restore_value: no
    initial_value: '0'

  # Last touch time tracking
  # Written by the printer page's nav button only; nothing reads it (the
  # rotation timer is last_auto_rotation_time above).
  # Must be unsigned long to match millis() return type and avoid
  # signed overflow after ~24.8 days of uptime.
  - id: last_touch_time
    type: unsigned long
    initial_value: '0'

# ============================================================================
# Number Components
# ============================================================================
number:
  # Auto page rotation interval control
  # Allows adjusting how long each page displays before rotating
  - platform: template
    name: "Auto Page Rotation Interval"
    id: page_rotation_interval
    icon: mdi:timer
    restore_value: true
    initial_value: 30
    min_value: 5
    max_value: 300
    entity_category: "config"
    unit_of_measurement: "s"
    optimistic: true
    step: 1
    mode: box
    on_value:
      - lambda: 'id(auto_page_rotation_interval) = (int)x;'
      - logger.log:
          format: "Page rotation interval changed to %d seconds"
          args: ['(int)x']

  # AirQ page rotation order
  # Controls the position of AirQ page in the rotation sequence (1-10).
  # initial_value matches page_rotation_AirQ_order's default (2).
  - platform: template
    name: "Page Order: AirQ Page"
    id: page_order_AirQ
    icon: mdi:numeric
    restore_value: true
    initial_value: 2
    min_value: 1
    max_value: 10
    entity_category: "config"
    optimistic: true
    step: 1
    mode: box
    on_value:
      - lambda: 'id(page_rotation_AirQ_order) = (int)x;'
      - logger.log:
          format: "AirQ page order set to %d"
          args: ['(int)x']
      # Force immediate display refresh when on AirQ page (simple version - just execute time_update)
      - if:
          condition:
            lambda: 'return id(current_page_name) == "airq";'
          then:
            - script.execute: time_update

# ============================================================================
# Switch Components
# ============================================================================
switch:
  # Individual page enable/disable switches for rotation
  # These control which pages are included in the automatic rotation cycle

  # AirQ page rotation control
  - platform: template
    name: "Page Rotation: AirQ Page"
    id: page_rotation_AirQ_switch
    icon: mdi:view-dashboard
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    entity_category: "config"
    on_turn_on:
      - lambda: 'id(page_rotation_AirQ_enabled) = true;'
      - logger.log: "AirQ page enabled in rotation"
    on_turn_off:
      - lambda: 'id(page_rotation_AirQ_enabled) = false;'
      - logger.log: "AirQ page disabled in rotation"

# Note: Printer page rotation switch and order number are in
#       features/printer/printer_base.yaml (co-located with the HA sensors)

# Note: Auto Page Rotation master switch is in diagnostics.yaml
# Note: Individual page switches for Clock, WiFi, Weather are in their respective capability modules
# Note: every page's order number accepts 1-10, and the shipped defaults are
#       clock 1, AirQ 2, WiFi 3, weather 4, daily 5, hourly 6, hourly summary 7,
#       printer 8. Equal numbers rotate in declaration order (see
#       Halo-v1-Core.yaml). Keep each number's initial_value equal to its
#       global's initial_value.

# ============================================================================
# Select Components
# ============================================================================
select:
  # Default page to display at boot, applied by Halo-v1-Core.yaml's on_boot
  # once Home Assistant connects (the clock shows until then). The option
  # strings are matched there, so rename both together. restore_value keeps
  # the option's index: append new options, never reorder.
  - platform: template
    name: "Default Page at Boot"
    id: default_page_select_boot
    optimistic: true
    options:
      - "Vertical Clock"
      - "Weather"
      - "AirQ"
      - "WiFi"
      - "Daily Forecast"
      - "Hourly Forecast"
      - "Hourly Summary"
      - "3D Printer"
    initial_option: "Vertical Clock"
    restore_value: true

# ============================================================================
# Script Components
# ============================================================================
script:
  # Page transition cleanup script, run from every page's on_load.
  # Clears the cached clock and weather-condition text so the next update
  # re-renders on the new page, and invalidates the screen for a full repaint.
  - id: page_transition_cleanup
    mode: queued  # Queue executions instead of warning about duplicates
    max_runs: 2   # Allow up to 2 queued runs
    then:
      - if:
          condition:
            lambda: 'return id(boot_complete) && !id(ota_in_progress);'
          then:
            - delay: 50ms  # Small delay to prevent rapid successive calls
            - lambda: |-
                // Safety check: Only run if LVGL is fully initialized
                lv_obj_t *scr = lv_scr_act();
                if (scr == NULL) {
                return;  // Silently skip if not initialized
                }

                // Log current memory state before cleanup
                ESP_LOGD("lvgl", "Page transition cleanup - Free heap: %lu", esp_get_free_heap_size());

                // Clear cached text so the next update sees a change and
                // re-renders on the page now showing.
                id(time_update_last_text).clear();
                id(weather_last_condition).clear();

                // Invalidate current screen to schedule a redraw on the next LVGL render pass.
                // NOTE: lv_refr_now(NULL) was removed here — in LVGL v9 (ESPHome 2026.4.0+)
                // calling a synchronous render from inside a script lambda while LVGL is in
                // delegate mode can corrupt the display pipeline and cause black screens.
                // lv_obj_invalidate is sufficient; LVGL will flush on its own next cycle.
                lv_obj_invalidate(scr);
