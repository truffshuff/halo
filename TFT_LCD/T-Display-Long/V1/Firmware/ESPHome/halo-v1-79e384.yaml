substitutions:
  # Device Configuration
  name: halo-v1-79e384  # Override Core's default 'halo' name
  # Home Assistant connection for HTTP API calls
  # Create a long-lived access token in HA: Profile → Security → Long-Lived Access Tokens
  # Temporary override for HA endpoint testing
  # Use HA's LAN address, not the nginx hostname. Every Halo lives on the IoT
  # VLAN (10.140.80.0/24) and so does Home Assistant (10.140.80.2), so this is
  # an intra-subnet call: no DNS, no zone traversal, no TLS handshake.
  #
  # halocal.hhut.org does NOT work from these devices, for two independent
  # reasons confirmed against the UniFi controller on 2026-09-20:
  #   1. There are no static DNS records on the controller, and the UnTrusted
  #      zone may only query the gateway (public resolvers, DoT and DoH are all
  #      blocked), so the name resolves to nothing -> getaddrinfo EAI_FAIL.
  #   2. nginx (10.140.40.9) sits in the Protected zone. The only UnTrusted ->
  #      nginx ALLOW rule is scoped to one client MAC (the old iPad), so even a
  #      correct IP would be dropped.
  # Each failed lookup blocks loopTask ~7s; enough of them reboot the device.
  ha_url: "http://10.140.80.2:8123"
  ha_token: !secret ha_token  # Your long-lived access token

  # 3D Printer — BambuLab device serial prefix used in Home Assistant entity IDs.
  # Find yours in HA: navigate to any BambuLab entity and copy the part before the first _
  # Example entity: sensor.h2c_31b8ap5c0301590_print_status → prefix is h2c_31b8ap5c0301590
  printer_device_id: "h2c_31b8ap5c0301590"

  # Weather configuration (if enabled below)
  weather_entity_id: "weather.hhut"
  weather_daily_refresh_interval: "3600"  # 60 minutes for daily forecast
  weather_hourly_refresh_interval: "900"  # 15 minutes for hourly forecast
  current_temp_sensor: "sensor.st_00143056_temperature"  # Your actual sensor
  apparent_temp_sensor: "sensor.st_00143056_feels_like"  # Your actual sensor
  wind_speed_sensor: "sensor.st_00143056_wind_speed"  # Your actual sensor
  wind_direction_sensor: "sensor.st_00143056_wind_direction"  # Your actual sensor

  # Network Configuration
  wifi_ssid: !secret wifihome_ssid
  wifi_password: !secret wifihome_password
  # Optional alternate network selectable from the device web UI
  wifi_alt_ssid: !secret my_alt_ssid
  wifi_alt_password: !secret my_alt_password

  # Security
  ota_password: !secret ota_password

  # Temporary: default WireGuard switch ON for this device
  # Remove or set to RESTORE_DEFAULT_OFF after testing
  wireguard_default: "RESTORE_DEFAULT_ON"

  # API
  # 0s = never reboot on API disconnect (required for offline history buffering to survive outages)
  api_reboot_timeout: "0s"

esphome:
  friendly_name: Halo Air Quality Sensor Dev
  name_add_mac_suffix: false

  # # ⚠️ ONE-TIME: Clear Improv WiFi credentials on next boot
  # # REMOVE or comment out after one boot!
  # on_boot:
  #   - priority: 800  # Run very early, before WiFi
  #     then:
  #       - lambda: |-
  #           ESP_LOGW("main", "ONE-TIME: Clearing Improv WiFi credentials from NVS");
  #           auto pref = global_preferences->make_preference<uint8_t>(0x9B5A7C21);
  #           uint8_t dummy = 0;
  #           pref.save(&dummy);
  #           ESP_LOGI("main", "Improv WiFi credentials cleared! YAML WiFi will be used.");
  #           ESP_LOGW("main", "REMEMBER: Remove this on_boot code from YAML after this boot!");

  # REMOVED 2026.09: a `platformio_options:` block (upload_speed,
  # board_build.flash_mode/psram_type/f_flash/f_cpu). The build uses the native
  # ESP-IDF toolchain, where those keys are inert - verified with
  # `esphome config`, which resolved the same esp32: settings with and without
  # them. Flash mode/frequency and CPU frequency now come from the
  # framework-agnostic esp32: keys in packages/system/esphome_core.yaml, and
  # PSRAM octal/80MHz from the top-level psram: component there.

  min_version: 2026.9.0

  project:
    name: "yashmulgaonkar.Halo-v1"
    version: "${version}"

dashboard_import:
  package_import_url: github://truffshuff/halo/TFT_LCD/T-Display-Long/V1/Firmware/ESPHome/Halo-v1.yaml@modular
  import_full_config: true

ota:
  - platform: esphome
    id: ota_default
    password: ${ota_password}
    on_begin:
      - lambda: 'id(ota_in_progress) = true;'
      # Pause BLE scanning during OTA to ensure clean API communication
      - switch.turn_off: ble_scanner_switch
      # ----------------------------------------------------------------
      # Quiesce everything that competes with the OTA transfer.
      # ----------------------------------------------------------------
      # The transfer is lockstep - 8 KB out, then block on a one-byte ACK,
      # ~290 times - so anything that stalls the main loop or steals the 2.4
      # GHz radio multiplies across every round trip.
      #
      # Pausing the BLE *scan* alone (above) is not enough: it leaves the I2C
      # sensors, LVGL repaints and the 180s cover-image download running.
      # SEN55 alone blocks the I2C bus for 4+ seconds per read.
      #
      # component.suspend works on any PollingComponent and is reversed by
      # component.resume. lvgl.pause stops rendering; the display simply holds
      # its last frame. The display watchdog is already gated on
      # ota_in_progress, so it will not fight this.
      - lvgl.pause:
      - component.suspend: sen55      # 60s, blocks I2C 4+ seconds per read
      - component.suspend: scd40      # 30s
      - component.suspend: mics4514   # 40s
      - component.suspend: bme280     # 60s
      - component.suspend: printer_cover_image_data   # 180s, 22 KB HTTP GET
      - logger.log: "OTA started - device quiesced (BLE scan, LVGL, I2C sensors, cover image)"
    on_end:
      - lambda: 'id(ota_in_progress) = false;'
      # Resume BLE scanning after OTA completes
      - switch.turn_on: ble_scanner_switch
      # Undo the OTA quiesce. On success the device reboots moments later so
      # this rarely runs; on failure it is what restores normal operation.
      - lvgl.resume:
      - component.resume: sen55
      - component.resume: scd40
      - component.resume: mics4514
      - component.resume: bme280
      - component.resume: printer_cover_image_data
      - logger.log: "OTA completed - device resumed"
    on_error:
      - lambda: 'id(ota_in_progress) = false;'
      # Resume BLE scanning if OTA fails
      - switch.turn_on: ble_scanner_switch
      # Undo the OTA quiesce. On success the device reboots moments later so
      # this rarely runs; on failure it is what restores normal operation.
      - lvgl.resume:
      - component.resume: sen55
      - component.resume: scd40
      - component.resume: mics4514
      - component.resume: bme280
      - component.resume: printer_cover_image_data
      - logger.log: "OTA failed - device resumed"


# safe_mode:
