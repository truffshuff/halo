wifi:
  # ==========================================================================
  # WiFi radio settings - MEASURED, do not "optimise" without re-measuring
  # ==========================================================================
  # output_power 15dB is load-bearing, not caution. Measured on halo-v1-79e1f8
  # (RSSI -48 dBm, noise -96, AP satisfaction 100), same image, same AP:
  #
  #   output_power  power_save_mode   OTA prepare   OTA upload    rate
  #   15dB          default (light)   0.03 s        104.6 s       22.7 kB/s
  #   default 20dBm none              13.92 s       890.3 s       2.67 kB/s
  #
  # 8.5x slower with the "better" radio settings. Note prepare going 0.03s ->
  # 13.92s: that is a tiny exchange before any bulk data, so the link itself
  # was degraded, not just throughput. Raising TX power at close range can
  # desense the AP receiver and raises current draw - the brownout risk this
  # comment originally warned about.
  #
  # power_save_mode is deliberately NOT set (ESP32 default: light). Setting it
  # to none was tried in the run above and is part of why it regressed. With
  # BLE coexistence active the arbiter appears to rely on WiFi's sleep windows
  # to schedule BLE; with PS_NONE, WiFi never yields and BLE preempts instead.
  # That mechanism is a hypothesis - the 8.5x regression is not.
  #
  # Both values changed together in that test, so which one dominates is
  # unknown. If you need to know, restore both, confirm ~105 s, then change one.
  output_power: 15dB
  # ESPHome 2026.1.0 enables post-connect roaming by default; disable for stationary devices
  post_connect_roaming: false
  use_address: 10.140.80.170

  on_connect:
    - delay: 5s # Gives time for improv results to be transmitted

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Halo Hotspot"

select:
  - platform: template
    name: "WiFi Target Network"
    id: wifi_target_network
    icon: mdi:wifi-cog
    entity_category: config
    options:
      - "YAML Default"
      - "Alternate"
    optimistic: true
    restore_value: true
    initial_option: "YAML Default"
    set_action:
      - logger.log:
          format: "WiFi target network set to %s"
          args: ['x.c_str()']

button:
  - platform: template
    name: "Start WiFi Provisioning Portal"
    id: start_wifi_provisioning_portal
    icon: mdi:wifi-settings
    entity_category: config
    on_press:
      - logger.log: "Starting WiFi provisioning mode; connect to fallback AP and open http://192.168.4.1"
      # Trigger a temporary failed connection attempt so fallback AP + captive portal activates.
      # save: false keeps the currently saved credentials intact.
      - wifi.configure:
          ssid: "__HALO_PROVISIONING_MODE__"
          password: ""
          save: false
          timeout: 20s
          on_error:
            - logger.log: "Provisioning AP should be active as 'Halo Hotspot'"

  - platform: template
    name: "Apply Selected WiFi"
    id: apply_selected_wifi
    icon: mdi:wifi-sync
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: 'return id(wifi_target_network).current_option() == "Alternate";'
          then:
            - logger.log: "Applying alternate WiFi credentials"
            - wifi.configure:
                ssid: !lambda 'return std::string("${wifi_alt_ssid}");'
                password: !lambda 'return std::string("${wifi_alt_password}");'
                save: true
                timeout: 30s
                on_connect:
                  - logger.log: "Connected to alternate WiFi credentials"
                on_error:
                  - logger.log: "Alternate WiFi failed, restoring YAML default credentials"
                  - wifi.configure:
                      ssid: !lambda 'return std::string("${wifi_ssid}");'
                      password: !lambda 'return std::string("${wifi_password}");'
                      save: true
                      timeout: 30s
          else:
            - logger.log: "Applying YAML default WiFi credentials"
            - wifi.configure:
                ssid: !lambda 'return std::string("${wifi_ssid}");'
                password: !lambda 'return std::string("${wifi_password}");'
                save: true
                timeout: 30s
                on_connect:
                  - logger.log: "Connected to YAML default WiFi credentials"
                on_error:
                  - logger.log: "YAML default WiFi connection failed"

