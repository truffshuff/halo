substitutions:
  # Device Configuration
  name: halo-v1-79e384  # Override Core's default 'halo' name
  # Home Assistant connection for HTTP API calls
  # Create a long-lived access token in HA: Profile → Security → Long-Lived Access Tokens
  ha_url: !secret ha_url  # Example: "http://homeassistant.local:8123"
  ha_token: !secret ha_token  # Your long-lived access token

  # 3D Printer — BambuLab device serial prefix used in Home Assistant entity IDs.
  # Find yours in HA: navigate to any BambuLab entity and copy the part before the first _
  # Example entity: sensor.h2c_31b8ap5c0301590_print_status → prefix is h2c_31b8ap5c0301590
  printer_device_id: "h2c_31b8ap5c0301590"

  # Weather configuration (if enabled below)
  weather_entity_id: "weather.hhut"
  weather_daily_refresh_interval: "3600"  # 60 minutes for daily forecast
  weather_hourly_refresh_interval: "900"  # 15 minutes for hourly forecast
  current_temp_sensor: "sensor.st_00143056_temperature"  # Your actual sensor
  apparent_temp_sensor: "sensor.st_00143056_feels_like"  # Your actual sensor
  wind_speed_sensor: "sensor.st_00143056_wind_speed"  # Your actual sensor
  wind_direction_sensor: "sensor.st_00143056_wind_direction"  # Your actual sensor

  # Network Configuration
  wifi_ssid: !secret wifihome_ssid
  wifi_password: !secret wifihome_password
  # Optional alternate network selectable from the device web UI
  wifi_alt_ssid: !secret my_alt_ssid
  wifi_alt_password: !secret my_alt_password

  # Security
  ota_password: !secret ota_password

  # API
  # 0s = never reboot on API disconnect (required for offline history buffering to survive outages)
  api_reboot_timeout: "0s"

esphome:
  friendly_name: Halo Air Quality Sensor Dev
  name_add_mac_suffix: false

  # # ⚠️ ONE-TIME: Clear Improv WiFi credentials on next boot
  # # REMOVE or comment out after one boot!
  # on_boot:
  #   - priority: 800  # Run very early, before WiFi
  #     then:
  #       - lambda: |-
  #           ESP_LOGW("main", "ONE-TIME: Clearing Improv WiFi credentials from NVS");
  #           auto pref = global_preferences->make_preference<uint8_t>(0x9B5A7C21);
  #           uint8_t dummy = 0;
  #           pref.save(&dummy);
  #           ESP_LOGI("main", "Improv WiFi credentials cleared! YAML WiFi will be used.");
  #           ESP_LOGW("main", "REMEMBER: Remove this on_boot code from YAML after this boot!");

  platformio_options:
    upload_speed: 921600
    board_build.flash_mode: qio
    board_build.psram_type: opi
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L

  min_version: 2026.6.0

  project:
    name: "yashmulgaonkar.Halo-v1"
    version: "${version}"

dashboard_import:
  package_import_url: github://truffshuff/halo/TFT_LCD/T-Display-Long/V1/Firmware/ESPHome/Halo-v1.yaml@modular
  import_full_config: true

ota:
  - platform: esphome
    id: ota_default
    password: ${ota_password}
    on_begin:
      - lambda: 'id(ota_in_progress) = true;'
      # Pause BLE scanning during OTA to ensure clean API communication
      - switch.turn_off: ble_scanner_switch
      - logger.log: "OTA started - low-activity mode enabled, BLE scanning paused"
    on_end:
      - lambda: 'id(ota_in_progress) = false;'
      # Resume BLE scanning after OTA completes
      - switch.turn_on: ble_scanner_switch
      - logger.log: "OTA completed - low-activity mode disabled, BLE scanning resumed"
    on_error:
      - lambda: 'id(ota_in_progress) = false;'
      # Resume BLE scanning if OTA fails
      - switch.turn_on: ble_scanner_switch
      - logger.log: "OTA failed - low-activity mode disabled, BLE scanning resumed"


# safe_mode:
#   disabled: true

wifi:
  # 15dBm improves OTA TCP throughput while remaining below the ESP32 default
  # maximum. Reduce this if the device shows brownout symptoms.
  output_power: 15dB
  # ESPHome 2026.1.0 enables post-connect roaming by default; disable for stationary devices
  post_connect_roaming: false
  use_address: 10.140.80.170

  on_connect:
    - delay: 5s # Gives time for improv results to be transmitted

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Halo Hotspot"

select:
  - platform: template
    name: "WiFi Target Network"
    id: wifi_target_network
    icon: mdi:wifi-cog
    entity_category: config
    options:
      - "YAML Default"
      - "Alternate"
    optimistic: true
    restore_value: true
    initial_option: "YAML Default"
    set_action:
      - logger.log:
          format: "WiFi target network set to %s"
          args: ['x.c_str()']

button:
  - platform: template
    name: "Apply Selected WiFi"
    id: apply_selected_wifi
    icon: mdi:wifi-sync
    entity_category: config
    on_press:
      - if:
          condition:
            lambda: 'return id(wifi_target_network).current_option() == "Alternate";'
          then:
            - logger.log: "Applying alternate WiFi credentials"
            - wifi.configure:
                ssid: !lambda 'return std::string("${wifi_alt_ssid}");'
                password: !lambda 'return std::string("${wifi_alt_password}");'
                save: true
                timeout: 30s
                on_connect:
                  - logger.log: "Connected to alternate WiFi credentials"
                on_error:
                  - logger.log: "Alternate WiFi failed, restoring YAML default credentials"
                  - wifi.configure:
                      ssid: !lambda 'return std::string("${wifi_ssid}");'
                      password: !lambda 'return std::string("${wifi_password}");'
                      save: true
                      timeout: 30s
          else:
            - logger.log: "Applying YAML default WiFi credentials"
            - wifi.configure:
                ssid: !lambda 'return std::string("${wifi_ssid}");'
                password: !lambda 'return std::string("${wifi_password}");'
                save: true
                timeout: 30s
                on_connect:
                  - logger.log: "Connected to YAML default WiFi credentials"
                on_error:
                  - logger.log: "YAML default WiFi connection failed"

